<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>О системе</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel: #16202e; --panel-2: #1c2839; --panel-3: #223147;
    --text: #e8eef7; --muted: #8496ab; --border: #26344a; --accent: #2f9e44; --red: #ef4444;
    --blue: #3b82f6; --amber: #f59e0b;
  }
  body { font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #16202e 0%, var(--bg) 60%); color: var(--text); padding: 20px; min-height: 100vh; }
  .wrap { max-width: 800px; margin: 0 auto; }
  
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .card h3 { font-size: 1.05rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .row:last-child { border-bottom: none; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-weight: 600; }
  
  .theme-switcher { display: flex; gap: 8px; margin-top: 10px; }
  .theme-btn { flex: 1; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); cursor: pointer; font-weight: 600; }
  .theme-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  
  .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-switch { width: 44px; height: 24px; border-radius: 999px; background: var(--border); cursor: pointer; position: relative; transition: 0.2s; }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: white; border-radius: 50%; transition: 0.2s; }
  .toggle-switch.on::after { transform: translateX(20px); }

  /* Стили для Devlog */
  .devlog-list { display: flex; flex-direction: column; gap: 12px; }
  .devlog-item { background: var(--panel-2); border-left: 3px solid var(--blue); padding: 12px; border-radius: 8px; }
  .devlog-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  .devlog-author { font-weight: bold; color: var(--accent); }
  .devlog-text { font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }

  .add-form { display: flex; gap: 10px; margin-top: 15px; }
  .add-form input { flex: 1; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; }
  .btn-add { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .btn-add:hover { background: #37b24d; }

  .hidden { display: none !important; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2f9e44; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; opacity: 0; transition: 0.3s; z-index: 2000; pointer-events: none; }
  .toast.show { opacity: 1; bottom: 30px; }
</style>
</head>
<body>

<div class="wrap">
  <!-- Оформление -->
  <div class="card">
    <h3>Оформление</h3>
    <div class="theme-switcher">
      <button class="theme-btn" data-theme="light">Светлая</button>
      <button class="theme-btn active" data-theme="dark">Тёмная</button>
    </div>
  </div>

  <!-- Состояние -->
  <div class="card">
    <h3>Состояние соединения</h3>
    <div class="row"><span>Версия планшета</span><span>1.0</span></div>
    <div class="row"><span>Сервер (Worker)</span><span id="aboutServer" style="color:var(--amber)">Проверка…</span></div>
    <div class="row"><span>Пользователь</span><span id="aboutUser">—</span></div>
    <div class="row"><span>Роль</span><span id="aboutRole">—</span></div>
  </div>

  <!-- Уведомления -->
  <div class="card">
    <h3>Уведомления</h3>
    <div class="toggle-row">
      <div>
        <div style="font-weight:600;">Всплывающие уведомления</div>
        <div style="font-size:0.75rem; color:var(--muted);">Показывать подсказки вверху экрана</div>
      </div>
      <div class="toggle-switch on" id="toggleToasts"></div>
    </div>
    <div class="toggle-row">
      <div>
        <div style="font-weight:600;">Звук</div>
        <div style="font-size:0.75rem; color:var(--muted);">Проигрывать звук при новых записях</div>
      </div>
      <div class="toggle-switch on" id="toggleSound"></div>
    </div>
  </div>

  <!-- Devlog -->
  <div class="card">
    <h3>📝 Devlog — журнал изменений</h3>
    <div class="devlog-list" id="devlogList">
      <div style="text-align:center; padding:20px; color:var(--muted);">Загрузка...</div>
    </div>

    <!-- Форма добавления (для админов) -->
    <div class="add-form hidden" id="addForm">
      <input type="text" id="newDevlogText" placeholder="Что нового мы сделали?">
      <button class="btn-add" onclick="addDevlog()">Добавить</button>
    </div>
  </div>
</div>

<div class="toast" id="toastMsg">Готово</div>

<script>
  const $ = (id) => document.getElementById(id);
  const WORKER_URL = "https://goverment.vadrgnuil.workers.dev"; 
  
  // Получаем данные пользователя из iframe
  const urlParams = new URLSearchParams(window.location.search);
  const userName = urlParams.get('user') || 'Гость';
  const userRole = urlParams.get('role') || '—';
  
  $("aboutUser").textContent = userName;
  $("aboutRole").textContent = userRole;

  // Показываем форму добавления, если роль позволяет
  if (['Бог', 'Министр здравоохранения'].includes(userRole)) {
    $("addForm").classList.remove("hidden");
  }

  // Проверка сервера
  fetch(WORKER_URL, { method: "POST", body: JSON.stringify({action: "ping"}) })
    .then(res => {
      if(res.ok) {
        $("aboutServer").textContent = "Доступен ✓";
        $("aboutServer").style.color = "var(--accent)";
      }
    }).catch(() => {
      $("aboutServer").textContent = "Недоступен ✗";
      $("aboutServer").style.color = "var(--red)";
    });

  // Переключатель темы
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      window.parent.postMessage({ action: "setTheme", theme: btn.dataset.theme }, "*");
    });
  });

  // Тумблеры
  $("toggleToasts").addEventListener("click", function() { this.classList.toggle("on"); });
  $("toggleSound").addEventListener("click", function() { this.classList.toggle("on"); });

  // ЗАГРУЗКА DEVLOG
  async function loadDevlog() {
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getDevlog" })
      });
      const data = await res.json();
      
      if (data.success && data.devlog.length > 0) {
        renderDevlog(data.devlog);
      } else {
        $("devlogList").innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">Записей пока нет</div>';
      }
    } catch(e) {
      $("devlogList").innerHTML = '<div style="text-align:center; padding:20px; color:red;">Ошибка загрузки</div>';
    }
  }

  function renderDevlog(entries) {
    $("devlogList").innerHTML = entries.map(e => {
      const date = new Date(e.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      return `
        <div class="devlog-item">
          <div class="devlog-meta">
            <span class="devlog-author">👤 ${e.author}</span>
            <span>${date}</span>
          </div>
          <div class="devlog-text">${e.text}</div>
        </div>
      `;
    }).join('');
  }

  window.addDevlog = async () => {
    const text = $("newDevlogText").value.trim();
    if (!text) return showToast("Введите текст", "red");

    try {
      await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "addDevlog", text: text, author: userName })
      });
      $("newDevlogText").value = "";
      showToast("✅ Запись добавлена!");
      loadDevlog();
    } catch(e) {
      showToast("Ошибка сети", "red");
    }
  };

  function showToast(msg, color = "green") {
    const t = $("toastMsg");
    t.textContent = msg;
    t.style.background = color === "red" ? "#ef4444" : "#2f9e44";
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  // Запуск
  loadDevlog();
</script>
</body>
</html>
