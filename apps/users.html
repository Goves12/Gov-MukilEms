<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учётные записи</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel-2: #1c2839; --text: #e8eef7; --muted: #8496ab;
    --border: #26344a; --border-strong: #3a4a66; --accent: #2f9e44;
    --error-bg: #4c1d1d; --error-text: #fecaca; --red: #ef4444;
  }
  body { font-family: system-ui, sans-serif; background: transparent; color: var(--text); padding: 10px; }
  
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  
  .btn-back {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; background: #1c2839; border: 1px solid var(--border);
    border-radius: 8px; color: white; cursor: pointer; font-weight: 600; font-family: inherit;
    transition: background 0.2s;
  }
  .btn-back:hover { background: #26344a; }
  
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
  
  #usersList { border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2); overflow: hidden; }
  .user-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .user-row:last-child { border-bottom: none; }
  .user-info { display: flex; flex-direction: column; gap: 4px; }
  .user-login { font-weight: 600; font-size: 0.95rem; }
  .user-role { font-size: 0.75rem; color: var(--muted); }
  
  .btn-small { padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; background: var(--border); color: var(--text); border: none; cursor: pointer; }
  .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
  
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.72rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input, select { width: 100%; padding: 10px; font-size: 0.95rem; background: #0d1520; border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
  
  #userFormBlock { margin-top: 20px; padding: 20px; background: #16202e; border: 1px solid var(--border); border-radius: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header-row">
  <div class="header-left">
    <button class="btn-back" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Назад
    </button>
    <h2 style="font-size:1.1rem; margin:0;">Пользователи</h2>
  </div>
  <button class="btn-primary" id="addUserBtn">+ Добавить</button>
</div>

<div id="usersList"></div>

<div id="userFormBlock" class="hidden">
  <h3 id="userFormTitle" style="margin-bottom:15px; font-size:1rem;">Новый пользователь</h3>
  <input type="hidden" id="editUserLogin">
  
  <div class="form-group"><label>Логин</label><input type="text" id="newUserLogin"></div>
  <div class="form-group"><label>Пароль</label><input type="text" id="newUserPassword" placeholder="12345"></div>
  <div class="form-group"><label>Роль</label>
    <select id="newUserRole">
      <option value="Сотрудник">Сотрудник</option>
      <option value="Старший состав">Старший состав</option>
      <option value="Министр здравоохранения">Министр здравоохранения</option>
      <option value="Бог">Бог</option>
    </select>
  </div>
  <div class="form-group"><label>Отдел</label>
    <select id="newUserDepartment">
      <!-- ОСТАВЛЯЕМ ТОЛЬКО ОДИН ОТДЕЛ -->
      <option value="МинЗдрав">МинЗдрав</option>
    </select>
  </div>
  <div style="display:flex; gap:10px; margin-top:15px;">
    <button class="btn-primary" id="saveUserBtn" style="flex:1;">Сохранить</button>
    <button class="btn-primary" id="cancelUserBtn" style="flex:1; background:#64748b;">Отмена</button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const WORKER_URL = "https://goverment.vadrgnuil.workers.dev"; // Твой адрес

  // Кнопка назад
  $("backBtn").addEventListener("click", () => window.parent.postMessage({ action: "goBack" }, "*"));

  // Хэширование
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  // Загрузка списка с сервера
  async function loadUsers() {
    $("usersList").innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">Загрузка...</div>';
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getUsers" })
      });
      const data = await res.json();
      
      if (data.success && data.users.length > 0) {
        renderUsers(data.users);
      } else {
        $("usersList").innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">Нет пользователей</div>';
      }
    } catch (e) {
      $("usersList").innerHTML = '<div style="padding:20px; text-align:center; color:var(--red);">Ошибка связи с сервером</div>';
    }
  }

  // Отрисовка
  function renderUsers(users) {
    $("usersList").innerHTML = users.map(u => `
      <div class="user-row">
        <div class="user-info">
          <span class="user-login">${u.login}</span>
          <span class="user-role">Роль: ${u.role} · Отдел: ${u.department || 'МинЗдрав'} ${u.isTemp ? '(врем. пароль)' : ''}</span>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-small" onclick="editUser('${u.login}')">Изменить</button>
          <button class="btn-small btn-danger" onclick="deleteUser('${u.login}')">Удалить</button>
        </div>
      </div>
    `).join('');
  }

  // Открыть форму
  $("addUserBtn").addEventListener("click", () => {
    $("userFormTitle").textContent = "Новый пользователь";
    $("editUserLogin").value = "";
    $("newUserLogin").value = "";
    $("newUserPassword").value = "12345";
    $("newUserRole").value = "Сотрудник";
    $("newUserDepartment").value = "МинЗдрав"; // Жестко ставим МинЗдрав
    $("newUserLogin").disabled = false;
    $("userFormBlock").classList.remove("hidden");
  });

  $("cancelUserBtn").addEventListener("click", () => $("userFormBlock").classList.add("hidden"));

  // Сохранить
  $("saveUserBtn").addEventListener("click", async () => {
    const editLogin = $("editUserLogin").value;
    const login = $("newUserLogin").value.trim().toLowerCase();
    const pass = $("newUserPassword").value;
    const role = $("newUserRole").value;
    const department = "МинЗдрав"; // Всегда отправляем только МинЗдрав

    if (!login) return showToast("Введите логин");
    if (!editLogin && !pass) return showToast("Введите пароль");

    const btn = $("saveUserBtn");
    btn.disabled = true; btn.textContent = "Отправка...";

    try {
      const newHash = pass ? await sha256Hex(pass) : null;
      
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          action: "saveUser", 
          isEdit: !!editLogin,
          login, 
          newHash, 
          role, 
          department 
        })
      });
      const data = await res.json();

      if (data.success) {
        $("userFormBlock").classList.add("hidden");
        loadUsers();
      } else {
        showToast("Ошибка сохранения: " + data.message);
      }
    } catch (e) {
      showToast("Ошибка сети!");
    } finally {
      btn.disabled = false; btn.textContent = "Сохранить";
    }
  });

  window.editUser = (login) => {
    fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ action: "getUsers" }) })
      .then(r => r.json())
      .then(data => {
        const u = data.users.find(x => x.login === login);
        if (!u) return;
        
        $("userFormTitle").textContent = "Редактировать: " + login;
        $("editUserLogin").value = login;
        $("newUserLogin").value = login;
        $("newUserLogin").disabled = true;
        $("newUserPassword").value = "";
        $("newUserPassword").placeholder = "Оставьте пустым, чтобы не менять";
        $("newUserRole").value = u.role;
        $("newUserDepartment").value = "МинЗдрав";
        $("userFormBlock").classList.remove("hidden");
      });
  };

  window.deleteUser = (login) => {
    if (login === 'todd') return showToast("Нельзя удалить главного администратора!");
    if (!confirm(`Удалить пользователя ${login}?`)) return;
    
    fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "deleteUser", login })
    }).then(() => loadUsers());
  };

  loadUsers();
</script>
</body>
</html>
