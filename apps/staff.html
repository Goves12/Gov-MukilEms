<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Персонал больницы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel: #16202e; --panel-2: #1c2839; --panel-3: #223147;
    --text: #e8eef7; --muted: #8496ab; --border: #26344a; --accent: #2f9e44; --red: #ef4444;
    --input-bg: #0c1420; --blue: #3b82f6;
  }
  body { font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #16202e 0%, var(--bg) 60%); color: var(--text); padding: 20px; min-height: 100vh; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .btn-back { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: white; cursor: pointer; font-weight: 600; }
  
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-btn { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; color: var(--muted); font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .tab-btn .count { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }

  .btn-purple { background: #8b5cf6; color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-add { background: #06b6d4; color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  
  .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
  .filter-bar input { flex: 1; padding: 10px 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: white; outline: none; }
  .filter-bar select { width: 200px; padding: 10px 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: white; outline: none; }

  .tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .tbl th { text-align: left; font-size: 0.7rem; text-transform: uppercase; color: var(--muted); padding: 12px 10px; border-bottom: 1px solid var(--border); }
  .tbl td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  
  .action-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-left: 5px; }
  .action-btn:hover { background: var(--border); color: white; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group label { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .form-group input, .form-group select { padding: 12px; font-size: 0.95rem; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  
  .btn-submit { width: 100%; padding: 14px; background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; }
  .btn-submit:hover { background: #2563eb; color: white; }

  .hidden { display: none !important; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2f9e44; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; opacity: 0; transition: 0.3s; z-index: 2000; pointer-events: none; }
  .toast.show { opacity: 1; bottom: 30px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header-row">
    <button class="btn-back" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Назад
    </button>
    <h2 style="margin:0; font-size:1.1rem;">Персонал больницы</h2>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="active">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Активные <span class="count" id="countActive">0</span>
    </button>
    <button class="tab-btn" data-tab="fired">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      Уволенные <span class="count" id="countFired">0</span>
    </button>
  </div>

  <div class="card">
    <div class="card-head">
      <h3 style="font-size:1.1rem; margin:0;">Список сотрудников</h3>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <input type="file" id="aiFileInput" accept="image/*" style="display: none;" onchange="handleAIImage(event)">
        
        <button class="btn-purple" onclick="document.getElementById('aiFileInput').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          ИИ-Импорт
        </button>
        
        <button class="btn-outline" onclick="showToast('Функция в разработке', 'red')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Импорт / экспорт
        </button>
        
        <button class="btn-add" id="addBtn" onclick="toggleForm()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Добавить
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 Поиск по имени или № паспорта...">
      <select id="filterDept">
        <option value="all">Все отделы</option>
        <option value="МинЗдрав">МинЗдрав</option>
      </select>
      <div style="display:flex; align-items:center; color:var(--muted); font-size:0.85rem;">
        Всего: <b id="totalDisplay" style="margin-left:6px; color:var(--accent);">0</b>
      </div>
    </div>

    <div id="tableContainer"></div>
  </div>

  <div class="card hidden" id="formBlock">
    <div class="card-head">
      <h3 style="font-size:1.05rem; margin:0;">Новый сотрудник</h3>
      <button class="btn-back" onclick="toggleForm()">Отмена</button>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Имя Фамилия</label>
        <input type="text" id="newName" placeholder="Введите имя...">
      </div>
      <div class="form-group">
        <label>№ Паспорта</label>
        <input type="text" id="newPassport" placeholder="Введите паспорт...">
      </div>
      <div class="form-group">
        <label>Должность</label>
        <input type="text" id="newPosition" placeholder="Например: Стажёр">
      </div>
      <div class="form-group">
        <label>Ранг</label>
        <select id="newRank">
          <!-- Сюда JS вставит 28 рангов -->
        </select>
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>Отдел</label>
        <select id="newDepartment">
          <option value="МинЗдрав">МинЗдрав</option>
        </select>
      </div>
    </div>

    <button class="btn-submit" onclick="addStaff()">Добавить сотрудника</button>
  </div>
</div>

<div class="toast" id="toastMsg">Готово</div>

<script>
  const $ = (id) => document.getElementById(id);
  const WORKER_URL = "https://goverment.vadrgnuil.workers.dev"; 
  
  const urlParams = new URLSearchParams(window.location.search);
  const userRole = urlParams.get('role') || 'Сотрудник';
  const canEdit = ['Бог', 'Министр здравоохранения', 'Старший состав'].includes(userRole);

  let allStaff = [];
  let currentTab = 'active';

  // СПИСОК РАНГОВ (28 штук)
  const RANKS = [
    { id: 1, name: "Стажёр" }, { id: 2, name: "Менеджер" }, { id: 3, name: "Адвокат" },
    { id: 4, name: "Агент USSS" }, { id: 5, name: "Спец. Агент USSS" }, { id: 6, name: "Старший менеджер" },
    { id: 7, name: "Старший адвокат" }, { id: 8, name: "Судья" }, { id: 9, name: "Инструктор" },
    { id: 10, name: "Прокурор" }, { id: 11, name: "Федеральный прокурор" }, { id: 12, name: "Зам. Глава Коллегии Адв" },
    { id: 13, name: "Зам. Директора USSS" }, { id: 14, name: "Глава Коллегии Адвокатов" }, { id: 15, name: "Директор USSS" },
    { id: 16, name: "Представитель ОС" }, { id: 17, name: "Заместитель Министра" }, { id: 18, name: "Зам. Главы Администратора" },
    { id: 19, name: "Зам. Ген. Прокурора" }, { id: 20, name: "Министр" }, { id: 21, name: "Верховный Судья" },
    { id: 22, name: "Глава Администрации" }, { id: 23, name: "Министр Финансов" }, { id: 24, name: "Советник Губернатора" },
    { id: 25, name: "Генеральный Прокурор" }, { id: 26, name: "Представитель ВС" }, { id: 27, name: "Вице-Губернатор" },
    { id: 28, name: "Губернатор" }
  ];

  // Генерируем выпадающий список рангов при загрузке
  const rankSelect = $("newRank");
  RANKS.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = `${r.id} — ${r.name}`;
    rankSelect.appendChild(opt);
  });

  $("backBtn").addEventListener("click", () => window.parent.postMessage({ action: "goBack" }, "*"));

  if (!canEdit) {
    $("addBtn").style.display = "none";
  }

  function toggleForm() {
    $("formBlock").classList.toggle("hidden");
  }

  async function loadStaff() {
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getStaff" })
      });
      const data = await res.json();
      allStaff = data.staff || [];
      updateCounts();
      renderTable();
    } catch(e) {
      $("tableContainer").innerHTML = '<div style="text-align:center; padding:20px; color:red;">Ошибка загрузки</div>';
    }
  }

  function updateCounts() {
    $("countActive").textContent = allStaff.filter(s => !s.fired).length;
    $("countFired").textContent = allStaff.filter(s => s.fired).length;
  }

  function renderTable() {
    const search = $("searchInput").value.toLowerCase();
    const deptFilter = $("filterDept").value;

    const filtered = allStaff.filter(s => {
      const matchStatus = currentTab === 'active' ? !s.fired : s.fired;
      const matchSearch = (s.name || "").toLowerCase().includes(search) || (s.passport || "").includes(search);
      const matchDept = deptFilter === 'all' || s.department === deptFilter;
      return matchStatus && matchSearch && matchDept;
    });

    $("totalDisplay").textContent = filtered.length;

    if (filtered.length === 0) {
      $("tableContainer").innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">Ничего не найдено</div>';
      return;
    }

    let html = `
      <table class="tbl">
        <thead>
          <tr>
            <th>#</th>
            <th>Имя Фамилия</th>
            <th>№ Паспорта</th>
            <th>Должность</th>
            <th>Ранг</th>
            <th>Отдел</th>
            ${canEdit ? '<th style="text-align:right;">Действие</th>' : ''}
          </tr>
        </thead>
        <tbody>
    `;

    filtered.forEach((s, i) => {
      const rankObj = RANKS.find(r => r.id == s.rank);
      const rankName = rankObj ? rankObj.name : s.rank;

      html += `
        <tr>
          <td>${i + 1}</td>
          <td style="font-weight:600;">${s.name}</td>
          <td style="color:#86efac; font-weight:bold;">${s.passport || '—'}</td>
          <td>${s.position || '—'}</td>
          <td>${s.rank} — ${rankName}</td>
          <td><span style="background:rgba(59,130,246,0.2); color:#93c5fd; padding:4px 8px; border-radius:6px; font-size:0.75rem;">${s.department || 'МинЗдрав'}</span></td>
          ${canEdit ? `
            <td style="text-align:right;">
              ${currentTab === 'active' 
                ? `<button class="action-btn" title="Уволить" onclick="fireStaff(${s.id})" style="color:#fca5a5;">✖</button>`
                : `<button class="action-btn" title="Восстановить" onclick="restoreStaff(${s.id})" style="color:#86efac;">↺</button>`
              }
            </td>
          ` : ''}
        </tr>
      `;
    });

    html += `</tbody></table>`;
    $("tableContainer").innerHTML = html;
  }

  window.fireStaff = async (id) => {
    try {
      await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "fireStaff", id }) });
      showToast("Сотрудник уволен");
      loadStaff();
    } catch(e) { showToast("Ошибка", "red"); }
  };

  window.restoreStaff = async (id) => {
    try {
      await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "restoreStaff", id }) });
      showToast("Сотрудник восстановлен");
      loadStaff();
    } catch(e) { showToast("Ошибка", "red"); }
  };

  window.addStaff = async () => {
    const name = $("newName").value.trim();
    const passport = $("newPassport").value.trim();
    const position = $("newPosition").value.trim();
    const rank = $("newRank").value;
    const department = $("newDepartment").value;

    if (!name || !passport) return showToast("Введите имя и паспорт", "red");

    try {
      await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "addStaff", name, passport, position, rank, department })
      });
      showToast("✅ Сотрудник добавлен");
      $("newName").value = ""; $("newPassport").value = ""; $("newPosition").value = "";
      toggleForm();
      loadStaff();
    } catch(e) { showToast("Ошибка сети", "red"); }
  };

  // Обработка фото для ИИ
  async function handleAIImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    // Проверка размера файла (не больше 4 МБ)
    if (file.size > 4 * 1024 * 1024) {
      return showToast("❌ Картинка слишком большая (макс 4 МБ). Сожмите или обрежьте её.", "red");
    }

    showToast("🤖 ИИ смотрит на картинку... Подождите", "blue");

    const reader = new FileReader();
    reader.onload = async (e) => {
      const base64Image = e.target.result;

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "aiImportStaff", image: base64Image })
        });
        
        const data = await res.json();
        
        // ВЫВОДИМ СЫРОЙ ОТВЕТ В КОНСОЛЬ (F12)
        console.log("Ответ от ИИ:", data);

        if (data.success && data.staff && data.staff.length > 0) {
          let addedCount = 0;
          for (const person of data.staff) {
            let finalRank = person.rank ? String(person.rank).replace(/\D/g, '') : "1";
            if (person.rank === "Leader") finalRank = "28";
            if (!finalRank || finalRank === "0") finalRank = "1";

            await fetch(WORKER_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ 
                action: "addStaff", 
                name: person.name || "Неизвестный", 
                passport: person.passport || "00000", 
                position: person.position || "Сотрудник", 
                rank: finalRank, 
                department: "МинЗдрав"
              })
            });
            addedCount++;
          }
          showToast(`✅ ИИ добавил ${addedCount} сотрудников!`, "green");
          loadStaff();
        } else {
          // ПОКАЗЫВАЕМ ОШИБКУ ОТ СЕРВЕРА
          showToast(`❌ ${data.message || "ИИ не смог найти сотрудников на фото"}`, "red");
        }
      } catch (err) {
        console.error(err);
        showToast("❌ Ошибка при работе ИИ", "red");
      }
    };
    reader.readAsDataURL(file);
    event.target.value = ""; 
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderTable();
    });
  });

  $("searchInput").addEventListener("input", renderTable);
  $("filterDept").addEventListener("change", renderTable);

  function showToast(msg, color = "green") {
    const t = $("toastMsg");
    t.textContent = msg;
    t.style.background = color === "red" ? "#ef4444" : "#2f9e44";
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  loadStaff();
</script>
</body>
</html>
