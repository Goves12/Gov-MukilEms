<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Недельный отчет</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel-2: #1c2839; --text: #e8eef7; --muted: #8496ab;
    --border: #26344a; --accent: #2f9e44; --blue: #3b82f6; --red: #ef4444;
  }
  body { font-family: system-ui, sans-serif; background: transparent; color: var(--text); padding: 10px; }
  
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .btn-back { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #1c2839; border: 1px solid var(--border); border-radius: 8px; color: white; cursor: pointer; font-weight: 600; }
  
  .report-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
  .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .report-name { font-size: 1.1rem; font-weight: bold; }
  .report-sum { color: var(--accent); font-weight: bold; font-size: 1.1rem; }
  
  .report-details { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
  .report-text { background: var(--bg); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; margin-bottom: 15px; max-height: 150px; overflow-y: auto; }
  
  .btn-approve { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-approved { background: #14532d; color: #bbf7d0; cursor: default; }
</style>
</head>
<body>

<div class="header-row">
  <button class="btn-back" id="backBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Назад
  </button>
  <h2 style="margin:0; font-size:1.1rem;">Недельный отчет (Премии)</h2>
</div>

<div id="reportsList">
  <div style="text-align:center; padding:20px; color:var(--muted);">Загрузка...</div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const WORKER_URL = "https://goverment.vadrgnuil.workers.dev";

  $("backBtn").addEventListener("click", () => window.parent.postMessage({ action: "goBack" }, "*"));

  async function loadReports() {
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getReports" })
      });
      const data = await res.json();
      
      if (data.success && data.reports.length > 0) {
        render(data.reports);
      } else {
        $("reportsList").innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">Отчетов пока нет</div>';
      }
    } catch(e) {
      $("reportsList").innerHTML = '<div style="text-align:center; padding:20px; color:var(--red);">Ошибка загрузки</div>';
    }
  }

  function render(reports) {
    $("reportsList").innerHTML = reports.map(r => `
      <div class="report-card">
        <div class="report-header">
          <div class="report-name">${r.employee_name}</div>
          <div class="report-sum">${r.total_sum.toLocaleString('ru-RU')} $</div>
        </div>
        <div class="report-details">Паспорт: ${r.passport} · Должность: ${r.role}</div>
        <div class="report-text">${r.report_text}</div>
        
        ${r.status === 'pending' 
          ? `<button class="btn-approve" onclick="approve(${r.id})">✅ Начислить премию</button>`
          : `<button class="btn-approve btn-approved">✅ Премия начислена</button>`
        }
      </div>
    `).join('');
  }

  window.approve = async (id) => {
    if (!confirm("Начислить премию этому сотруднику?")) return;
    await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "approveBonus", id: id })
    });
    loadReports(); // Перезагружаем список
  };

  loadReports();
</script>
</body>
</html>
