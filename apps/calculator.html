<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор Минздрава</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel-2: #1c2839; --text: #e8eef7; --muted: #8496ab;
    --border: #26344a; --accent: #2f9e44; --blue: #3b82f6; --red: #ef4444;
    --success-bg: #14532d; --success-text: #bbf7d0;
  }
  body { font-family: system-ui, sans-serif; background: transparent; color: var(--text); padding: 10px; }
  
  /* Шапка */
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .btn-back {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; background: #1c2839; border: 1px solid var(--border);
    border-radius: 8px; color: white; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .btn-back:hover { background: #26344a; }

  /* Карточки */
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .card h3 { font-size: 1.05rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input { width: 100%; padding: 10px; font-size: 0.95rem; background: #0d1520; border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
  input:focus { border-color: var(--accent); outline: none; }

  /* Услуги */
  .service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .service-name { font-size: 0.9rem; flex: 1; }
  .service-price { font-weight: 600; color: var(--accent); min-width: 80px; text-align: right; }
  .service-input {
    width: 70px; padding: 8px; text-align: center; font-size: 1rem; font-weight: bold;
    background: #0d1520; border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  }
  .service-input:focus { border-color: var(--accent); outline: none; }
  .service-input::-webkit-outer-spin-button, .service-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* Итоги */
  .totals-row { display: flex; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 2px dashed var(--border); }
  .total-box { flex: 1; background: var(--bg); padding: 15px; border-radius: 12px; text-align: center; }
  .total-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
  .total-value { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

  /* Кнопки */
  .action-bar { display: flex; gap: 10px; margin-top: 20px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; flex: 1; color: white; }
  .btn-green { background: var(--accent); }
  .btn-blue { background: var(--blue); }
  .btn-gray { background: #64748b; }
  .btn-red { background: var(--red); }

  /* Текстовое поле отчета */
  .report-area { width: 100%; height: 250px; background: #0d1520; border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 15px; font-family: monospace; font-size: 0.85rem; line-height: 1.5; resize: vertical; margin-top: 15px; display: none; }
  
  .notification { background: var(--success-bg); color: var(--success-text); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 20px; display: none; }
</style>
</head>
<body>

<div class="header-row">
  <button class="btn-back" id="backBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Назад
  </button>
  <h2 style="margin:0; font-size:1.1rem;">Калькулятор доходов Минздрава</h2>
</div>

<!-- Данные сотрудника -->
<div class="card">
  <h3>Данные сотрудника</h3>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <div class="form-group" style="flex:1; min-width:200px;">
      <label>Фамилия и Имя</label>
      <input type="text" id="empName" placeholder="Todd West">
    </div>
    <div class="form-group" style="flex:1; min-width:200px;">
      <label>Номер паспорта</label>
      <input type="text" id="empPassport" placeholder="189087">
    </div>
    <div class="form-group" style="flex:1; min-width:200px;">
      <label>Должность</label>
      <input type="text" id="empRole" placeholder="Инструктор">
    </div>
  </div>
</div>

<!-- Услуги -->
<div class="card">
  <h3>Выполненные работы (Минздрав)</h3>
  <div id="servicesList"></div>
  
  <div class="totals-row">
    <div class="total-box">
      <div class="total-label">Итого к оплате</div>
      <div class="total-value" id="totalSum">0 $</div>
    </div>
  </div>
</div>

<!-- Кнопки -->
<div class="action-bar">
  <button class="btn btn-green" id="generateBtn">Сформировать отчет</button>
  <button class="btn btn-blue" id="copyBtn" style="display:none;">Копировать</button>
  <button class="btn btn-red" id="resetBtn">Сбросить всё</button>
</div>

<!-- Результат -->
<div class="notification" id="successMsg">✅ Отчет сформирован и скопирован!</div>
<textarea class="report-area" id="reportArea" readonly></textarea>

<script>
  const $ = (id) => document.getElementById(id);

  // Кнопка назад
  $("backBtn").addEventListener("click", () => window.parent.postMessage({ action: "goBack" }, "*"));

  // Услуги с ценами
  const SERVICES = [
    { id: "check_hosp", name: 'Проверка лечебного учреждения на наличие сотрудников', price: 8000 },
    { id: "event_ems", name: 'Проведение мероприятия для EMS', price: 10000 },
    { id: "social_ems", name: 'Проведение социального опроса для EMS', price: 6000 },
    { id: "check_ems", name: 'Проведение проверки EMS', price: 10000 },
    { id: "donor_day", name: 'Проведение Дня Донора', price: 15000 },
    { id: "briefing", name: 'Участие в брифинге EMS', price: 2000 }
  ];

  // Рисуем список с полями ввода
  const list = $("servicesList");
  SERVICES.forEach(srv => {
    const row = document.createElement("div");
    row.className = "service-row";
    row.innerHTML = `
      <span class="service-name">${srv.name}</span>
      <span class="service-price">${srv.price.toLocaleString('ru-RU')} $</span>
      <input type="number" class="service-input" id="inp_${srv.id}" min="0" value="0" data-price="${srv.price}" data-name="${srv.name}">
    `;
    list.appendChild(row);
  });

  // Подсчет
  function calculateTotal() {
    let total = 0;
    document.querySelectorAll('.service-input').forEach(input => {
      const count = parseInt(input.value) || 0;
      const price = parseInt(input.dataset.price);
      total += count * price;
    });
    $("totalSum").textContent = total.toLocaleString('ru-RU') + " $";
    return total;
  }

  document.querySelectorAll('.service-input').forEach(input => {
    input.addEventListener('input', calculateTotal);
  });

  // Генерация отчета (как на 2 скрине)
  $("generateBtn").addEventListener("click", () => {
    const name = $("empName").value.trim() || "Не указано";
    const passport = $("empPassport").value.trim() || "Не указано";
    const role = $("empRole").value.trim() || "Не указана";
    const total = calculateTotal();

    if (total === 0) {
      alert("Введите количество хотя бы для одной услуги!");
      return;
    }

    const date = new Date().toLocaleDateString('ru-RU');
    let text = `*** Работник: *** ${name}\n`;
    text += `*** Номер паспорта: *** ${passport}\n`;
    text += `*** Должность: *** ${role}\n`;
    text += `# Финансовый отчет (Минздрав) :pencil: #\n\n`;
    
    text += `## ИТОГО: ${total.toLocaleString('ru-RU')} $\n\n`;
    text += `### 🏥 Выполненные работы ###\n`;

    let hasWork = false;
    document.querySelectorAll('.service-input').forEach(input => {
      const count = parseInt(input.value) || 0;
      if (count > 0) {
        hasWork = true;
        const price = parseInt(input.dataset.price);
        const sum = count * price;
        text += `> ${input.dataset.name} (x${count}): ${sum.toLocaleString('ru-RU')} $\n`;
      }
    });

    if (!hasWork) text += `> Нет выполненных работ\n`;

    text += `\nДата формирования: ${date}`;

    // Показываем результат
    $("reportArea").value = text;
    $("reportArea").style.display = "block";
    $("copyBtn").style.display = "flex";
    
    // Автоматически копируем
    navigator.clipboard.writeText(text).then(() => {
      $("successMsg").style.display = "block";
      setTimeout(() => { $("successMsg").style.display = "none"; }, 3000);
    });
  });

  // Ручное копирование
  $("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText($("reportArea").value).then(() => {
      $("successMsg").style.display = "block";
      setTimeout(() => { $("successMsg").style.display = "none"; }, 3000);
    });
  });

  // Сброс
  $("resetBtn").addEventListener("click", () => {
    $("empName").value = "";
    $("empPassport").value = "";
    $("empRole").value = "";
    document.querySelectorAll('.service-input').forEach(inp => inp.value = "0");
    calculateTotal();
    $("reportArea").style.display = "none";
    $("copyBtn").style.display = "none";
  });
</script>
</body>
</html>
