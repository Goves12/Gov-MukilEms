<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор отчетов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel-2: #1c2839; --text: #e8eef7; --muted: #8496ab;
    --border: #26344a; --accent: #2f9e44; --blue: #3b82f6;
  }
  body { font-family: system-ui, sans-serif; background: transparent; color: var(--text); padding: 10px; }
  
  /* Шапка */
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .btn-back {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; background: #1c2839; border: 1px solid var(--border);
    border-radius: 8px; color: white; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .btn-back:hover { background: #26344a; }

  /* Карточки */
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .card h3 { font-size: 1.05rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input { width: 100%; padding: 10px; font-size: 0.95rem; background: #0d1520; border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
  input:focus { border-color: var(--accent); outline: none; }

  /* Услуги */
  .service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .service-row:last-child { border-bottom: none; }
  .service-name { font-size: 0.9rem; flex: 1; padding-right: 10px; }
  .service-price { font-weight: 600; color: var(--accent); min-width: 80px; text-align: right; margin-right: 15px; }
  .service-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); }

  /* Итог */
  .total-box { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 2px dashed var(--border); }
  .total-label { font-size: 1.1rem; font-weight: 700; }
  .total-value { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

  /* Кнопка */
  .btn-primary { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .btn-primary:hover { background: #37b24d; }
</style>
</head>
<body>

<div class="header-row">
  <button class="btn-back" id="backBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Назад
  </button>
  <h2 style="margin:0; font-size:1.1rem;">Калькулятор доходов</h2>
</div>

<!-- Данные сотрудника -->
<div class="card">
  <h3>Данные сотрудника</h3>
  <div class="form-group">
    <label>Имя и Фамилия</label>
    <input type="text" id="empName" placeholder="Иванов Иван">
  </div>
  <div class="form-group">
    <label>№ Номер паспорта</label>
    <input type="text" id="empPassport" placeholder="2452">
  </div>
</div>

<!-- Услуги -->
<div class="card">
  <h3>Выполненные работы (Минздрав)</h3>
  <div id="servicesList">
    <!-- Сюда будут вставляться услуги через JS -->
  </div>
  
  <div class="total-box">
    <span class="total-label">Итого к оплате:</span>
    <span class="total-value" id="totalSum">0 $</span>
  </div>
</div>

<button class="btn-primary" id="generateBtn">Сформировать отчет</button>

<!-- Модальное окно с результатом (появится поверх) -->
<div id="resultModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; padding:20px; overflow-y:auto;">
  <div style="background:var(--panel-2); border:1px solid var(--border); border-radius:16px; max-width:600px; margin:20px auto; padding:25px;">
    <h2 style="text-align:center; margin-bottom:20px;">📄 Отчет о выполненных работах</h2>
    <div id="reportContent" style="font-size:0.9rem; line-height:1.6;"></div>
    
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-primary" id="copyBtn" style="margin-top:0;">📋 Скопировать текст</button>
      <button class="btn-primary" id="closeBtn" style="margin-top:0; background:#64748b;">Закрыть</button>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // Кнопка назад
  $("backBtn").addEventListener("click", () => window.parent.postMessage({ action: "goBack" }, "*"));

  // Список услуг с ценами (как ты просил)
  const SERVICES = [
    { id: "check_hosp", name: 'Проверка лечебного учреждения на наличие сотрудников', price: 8000 },
    { id: "event_ems", name: 'Проведение мероприятия для EMS', price: 10000 },
    { id: "social_ems", name: 'Проведение социального опроса для EMS', price: 6000 },
    { id: "check_ems", name: 'Проведение проверки EMS', price: 10000 },
    { id: "donor_day", name: 'Проведение Дня Донора', price: 15000 },
    { id: "briefing", name: 'Участие в брифинге EMS', price: 2000 }
  ];

  // Отрисовка списка
  const list = $("servicesList");
  SERVICES.forEach(srv => {
    const row = document.createElement("div");
    row.className = "service-row";
    row.innerHTML = `
      <input type="checkbox" class="service-checkbox" data-id="${srv.id}" data-price="${srv.price}">
      <span class="service-name">${srv.name}</span>
      <span class="service-price">${srv.price.toLocaleString('ru-RU')} $</span>
    `;
    list.appendChild(row);
  });

  // Подсчет суммы
  function calculateTotal() {
    let total = 0;
    document.querySelectorAll('.service-checkbox:checked').forEach(cb => {
      total += parseInt(cb.dataset.price);
    });
    $("totalSum").textContent = total.toLocaleString('ru-RU') + " $";
    return total;
  }

  document.querySelectorAll('.service-checkbox').forEach(cb => {
    cb.addEventListener('change', calculateTotal);
  });

  // Генерация отчета
  $("generateBtn").addEventListener("click", () => {
    const name = $("empName").value.trim() || "Не указано";
    const passport = $("empPassport").value.trim() || "Не указано";
    const total = calculateTotal();

    if (total === 0) {
      alert("Выберите хотя бы одну выполненную работу!");
      return;
    }

    // Собираем выбранные услуги
    let servicesHTML = "";
    let servicesText = "";
    document.querySelectorAll('.service-checkbox:checked').forEach(cb => {
      const parent = cb.closest('.service-row');
      const srvName = parent.querySelector('.service-name').textContent;
      const srvPrice = cb.dataset.price;
      
      servicesHTML += `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #26344a;">
        <span>${srvName}</span>
        <span style="font-weight:bold; color:var(--accent);">${parseInt(srvPrice).toLocaleString('ru-RU')} $</span>
      </div>`;
      
      servicesText += `- ${srvName}: ${parseInt(srvPrice).toLocaleString('ru-RU')} $\n`;
    });

    // Формируем красивый отчет
    const reportHTML = `
      <div style="text-align:center; margin-bottom:20px;">
        <div style="font-size:1.1rem; font-weight:bold;">Министерство Здравоохранения</div>
        <div style="font-size:0.85rem; color:var(--muted);">Финансовый отчет о работах</div>
      </div>
      <div style="margin-bottom:15px; background:#0d1520; padding:10px; border-radius:8px;">
        <div><b>Сотрудник:</b> ${name}</div>
        <div><b>Паспорт:</b> ${passport}</div>
        <div><b>Дата:</b> ${new Date().toLocaleDateString('ru-RU')}</div>
      </div>
      <div style="margin-bottom:15px;">
        <div style="font-weight:bold; margin-bottom:8px;">Выполненные работы:</div>
        ${servicesHTML}
      </div>
      <div style="display:flex; justify-content:space-between; font-size:1.1rem; font-weight:bold; margin-top:15px; padding-top:15px; border-top:2px solid var(--border);">
        <span>ИТОГО:</span>
        <span style="color:var(--accent);">${total.toLocaleString('ru-RU')} $</span>
      </div>
    `;

    $("reportContent").innerHTML = reportHTML;
    $("resultModal").style.display = "block";

    // Сохраняем текст для копирования
    window._reportText = `МИНИСТЕРСТВО ЗДРАВООХРАНЕНИЯ\nОтчет о выполненных работах\n\nСотрудник: ${name}\nПаспорт: ${passport}\nДата: ${new Date().toLocaleDateString('ru-RU')}\n\nВыполненные работы:\n${servicesText}\nИТОГО К ОПЛАТЕ: ${total.toLocaleString('ru-RU')} $`;
  });

  // Копирование
  $("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(window._reportText).then(() => {
      alert("Текст отчета скопирован в буфер обмена!");
    });
  });

  // Закрытие модалки
  $("closeBtn").addEventListener("click", () => {
    $("resultModal").style.display = "none";
  });
</script>
</body>
</html>
