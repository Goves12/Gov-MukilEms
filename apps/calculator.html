<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Калькулятор денег</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  
  .app {
    width: 100%;
    max-width: 700px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  
  header {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
    padding: 24px;
    text-align: center;
  }
  
  header h1 { font-size: 24px; margin-bottom: 4px; }
  header p { font-size: 13px; opacity: 0.9; }
  
  .total-box {
    background: #f7f9fc;
    padding: 24px;
    text-align: center;
    border-bottom: 1px solid #e1e8ed;
  }
  
  .total-label {
    font-size: 13px;
    color: #8899a6;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  
  .total-value {
    font-size: 42px;
    font-weight: 800;
    color: #11998e;
    transition: transform 0.15s;
  }
  
  .total-value.bump { transform: scale(1.08); }
  
  .sections { padding: 20px; }
  
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin: 20px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .section-title:first-child { margin-top: 0; }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f7f9fc;
    border-radius: 12px;
    padding: 10px;
    transition: background 0.2s;
  }
  
  .item:focus-within { background: #e8f5f1; }
  
  .item .nominal {
    flex: 1;
    font-weight: 700;
    font-size: 14px;
    color: #333;
    white-space: nowrap;
  }
  
  .item input {
    width: 52px;
    padding: 6px;
    border: 1px solid #ccd6dd;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #11998e;
    outline: none;
  }
  
  .item input:focus { border-color: #11998e; }
  
  /* Убираем стрелки у number */
  .item input::-webkit-outer-spin-button,
  .item input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .item input[type=number] { -moz-appearance: textfield; }
  
  .item .subtotal {
    font-size: 11px;
    color: #8899a6;
    min-width: 38px;
    text-align: right;
  }
  
  .actions {
    display: flex;
    gap: 12px;
    padding: 20px;
    background: #f7f9fc;
    border-top: 1px solid #e1e8ed;
  }
  
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .btn-reset {
    background: #fff;
    color: #e74c3c;
    border: 1px solid #e74c3c;
  }
  .btn-reset:hover { background: #e74c3c; color: #fff; }
  
  .btn-copy {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff;
  }
  .btn-copy:hover { opacity: 0.9; transform: translateY(-1px); }
  
  /* Разбивка */
  .breakdown {
    padding: 0 20px 20px;
    display: none;
  }
  .breakdown.show { display: block; }
  .breakdown h3 {
    font-size: 14px;
    color: #555;
    margin: 12px 0 8px;
  }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dashed #e1e8ed;
  }
  .breakdown-row span:last-child { font-weight: 600; color: #11998e; }
  
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  
  @media (max-width: 480px) {
    .total-value { font-size: 32px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>💰 Калькулятор денег</h1>
    <p>Введи количество купюр и монет</p>
  </header>
  
  <div class="total-box">
    <div class="total-label">Итого</div>
    <div class="total-value" id="total">0 ₽</div>
  </div>
  
  <div class="sections">
    <div class="section-title">💵 Купюры</div>
    <div class="grid" id="bills"></div>
    
    <div class="section-title">🪙 Монеты</div>
    <div class="grid" id="coins"></div>
  </div>
  
  <div class="breakdown" id="breakdown"></div>
  
  <div class="actions">
    <button class="btn-reset" onclick="resetAll()">🗑 Очистить</button>
    <button class="btn-copy" onclick="copyResult()">📋 Копировать итог</button>
  </div>
</div>

<div class="toast" id="toast">Скопировано!</div>

<script>
  // Номиналы
  const BILLS = [5000, 2000, 1000, 500, 200, 100, 50];
  const COINS = [10, 5, 2, 1];
  
  // Хранилище значений
  const values = {};
  
  function formatMoney(n) {
    return n.toLocaleString('ru-RU') + ' ₽';
  }
  
  // Создание поля для номинала
  function createItem(nominal, container) {
    const item = document.createElement('div');
    item.className = 'item';
    
    const label = document.createElement('div');
    label.className = 'nominal';
    label.textContent = nominal >= 1 && nominal < 100 
      ? nominal + ' ₽' 
      : nominal + ' ₽';
    
    const input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.value = '0';
    input.dataset.nominal = nominal;
    input.addEventListener('input', () => {
      const v = Math.max(0, parseInt(input.value) || 0);
      input.value = v;
      values[nominal] = v;
      update();
    });
    
    const sub = document.createElement('div');
    sub.className = 'subtotal';
    sub.id = 'sub-' + nominal;
    sub.textContent = '0';
    
    item.appendChild(label);
    item.appendChild(input);
    item.appendChild(sub);
    container.appendChild(item);
  }
  
  // Инициализация
  const billsEl = document.getElementById('bills');
  const coinsEl = document.getElementById('coins');
  BILLS.forEach(n => createItem(n, billsEl));
  COINS.forEach(n => createItem(n, coinsEl));
  
  // Пересчёт
  function update() {
    let total = 0;
    const breakdown = [];
    
    [...BILLS, ...COINS].forEach(nominal => {
      const count = values[nominal] || 0;
      const sum = count * nominal;
      total += sum;
      
      // Обновляем подытог у поля
      const subEl = document.getElementById('sub-' + nominal);
      if (subEl) subEl.textContent = sum > 0 ? formatMoney(sum) : '0';
      
      if (count > 0) {
        breakdown.push({ nominal, count, sum });
      }
    });
    
    // Анимация итога
    const totalEl = document.getElementById('total');
    totalEl.textContent = formatMoney(total);
    totalEl.classList.add('bump');
    setTimeout(() => totalEl.classList.remove('bump'), 150);
    
    // Разбивка
    const bd = document.getElementById('breakdown');
    if (breakdown.length > 0) {
      bd.classList.add('show');
      bd.innerHTML = '<h3>📊 Разбивка</h3>' +
        breakdown.map(b => 
          `<div class="breakdown-row">
            <span>${b.count} × ${b.nominal} ₽</span>
            <span>${formatMoney(b.sum)}</span>
          </div>`
        ).join('');
    } else {
      bd.classList.remove('show');
    }
  }
  
  // Сброс
  function resetAll() {
    document.querySelectorAll('.item input').forEach(inp => {
      inp.value = '0';
    });
    Object.keys(values).forEach(k => delete values[k]);
    update();
  }
  
  // Копирование
  function copyResult() {
    const total = document.getElementById('total').textContent;
    const breakdown = [];
    [...BILLS, ...COINS].forEach(nominal => {
      const count = values[nominal] || 0;
      if (count > 0) breakdown.push(`${count} × ${nominal} ₽ = ${count * nominal} ₽`);
    });
    
    const text = 'Сумма: ' + total + 
      (breakdown.length ? '\n\n' + breakdown.join('\n') : '');
    
    navigator.clipboard.writeText(text).then(() => {
      showToast('✅ Скопировано в буфер обмена');
    }).catch(() => {
      showToast('❌ Не удалось скопировать');
    });
  }
  
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
  
  // Стартовый расчёт
  update();
</script>
</body>
</html>
