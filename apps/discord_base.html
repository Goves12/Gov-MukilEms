<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База Discord</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel: #16202e; --panel-2: #1c2839;
    --text: #e8eef7; --muted: #8496ab; --border: #26344a;
    --accent: #2f9e44; --discord: #5865F2;
  }
  body { font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #16202e 0%, var(--bg) 60%); color: var(--text); padding: 20px; min-height: 100vh; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .btn-back { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: white; cursor: pointer; font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .card-head h3 { font-size: 1.1rem; margin: 0; display: flex; align-items: center; gap: 10px; }

  .tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .tbl th { text-align: left; font-size: 0.7rem; text-transform: uppercase; color: var(--muted); padding: 12px 10px; border-bottom: 1px solid var(--border); }
  .tbl td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:hover { background: rgba(255,255,255,0.02); }
  
  .discord-id { color: #a5b4fc; font-weight: bold; font-family: monospace; }
  .username { font-weight: 600; }
  .time { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header-row">
    <button class="btn-back" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Назад
    </button>
    <h2 style="margin:0; font-size:1.1rem;">База Discord</h2>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
        Список авторизованных
      </h3>
      <button class="btn-back" onclick="loadLogs()">🔄 Обновить</button>
    </div>
    
    <div id="tableContainer">
      <div style="text-align:center; padding:20px; color:var(--muted);">Загрузка...</div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const WORKER_URL = "https://goverment.vadrgnuil.workers.dev";

  $("backBtn").addEventListener("click", () => window.parent.postMessage({ action: "goBack" }, "*"));

  async function loadLogs() {
    $("tableContainer").innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">Загрузка...</div>';
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getDiscordLogs" })
      });
      const data = await res.json();

      if (data.success && data.logs.length > 0) {
        renderLogs(data.logs);
      } else {
        $("tableContainer").innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">Никто ещё не заходил через Discord</div>';
      }
    } catch(e) {
      $("tableContainer").innerHTML = '<div style="text-align:center; padding:20px; color:var(--red);">Ошибка загрузки</div>';
    }
  }

  function renderLogs(logs) {
    let html = `
      <table class="tbl">
        <thead>
          <tr>
            <th>#</th>
            <th>Discord ID</th>
            <th>Имя пользователя</th>
            <th>Время входа</th>
          </tr>
        </thead>
        <tbody>
    `;

    logs.forEach((l, i) => {
      const date = new Date(l.login_time).toLocaleString('ru-RU');
      html += `
        <tr>
          <td>${i + 1}</td>
          <td class="discord-id">${l.discord_id}</td>
          <td class="username">${l.username}</td>
          <td class="time">${date}</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    $("tableContainer").innerHTML = html;
  }

  loadLogs();
</script>
</body>
</html>
