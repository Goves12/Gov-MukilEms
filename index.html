<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор Минздрава</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel-2: #1c2839; --text: #e8eef7; --muted: #8496ab;
    --border: #26344a; --accent: #2f9e44; --blue: #3b82f6; --red: #ef4444;
  }
  body { font-family: system-ui, sans-serif; background: transparent; color: var(--text); padding: 10px; }
  
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .btn-back { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #1c2839; border: 1px solid var(--border); border-radius: 8px; color: white; cursor: pointer; font-weight: 600; }
  
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .card h3 { font-size: 1.05rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input { width: 100%; padding: 10px; font-size: 0.95rem; background: #0d1520; border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
  input:focus { border-color: var(--accent); outline: none; }

  /* Сетка для услуг */
  .services-grid { display: flex; flex-direction: column; gap: 10px; }
  .service-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); }
  .service-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .service-name { font-size: 0.9rem; }
  .service-price { font-size: 0.8rem; color: var(--accent); font-weight: bold; }
  
  .service-input {
    width: 80px; padding: 10px; text-align: center; font-size: 1.1rem; font-weight: bold;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  }
  .service-input:focus { border-color: var(--accent); outline: none; }
  
  .totals-row { display: flex; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 2px dashed var(--border); }
  .total-box { flex: 1; background: var(--bg); padding: 15px; border-radius: 12px; text-align: center; }
  .total-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
  .total-value { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

  .action-bar { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn { display: flex; align-items: center; justify-content: center; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; flex: 1; color: white; min-width: 150px; }
  .btn-green { background: var(--accent); }
  .btn-blue { background: var(--blue); }
  .btn-red { background: var(--red); }

  .report-area { width: 100%; height: 300px; background: #0d1520; border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 15px; font-family: monospace; font-size: 0.85rem; line-height: 1.5; resize: vertical; margin-top: 15px; display: none; }
</style>
</head>
<body>

<div class="header-row">
  <button class="btn-back" id="backBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Назад
  </button>
  <h2 style="margin:0; font-size:1.1rem;">Калькулятор доходов</h2>
</div>

<div class="card">
  <h3>Данные сотрудника</h3>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <div class="form-group" style="flex:1; min-width:150px;">
      <label>Фамилия и Имя</label>
      <input type="text" id="empName" placeholder="Todd West">
    </div>
    <div class="form-group" style="flex:1; min-width:150px;">
      <label>Номер паспорта</label>
      <input type="text" id="empPassport" placeholder="189087">
    </div>
    <div class="form-group" style="flex:1; min-width:150px;">
      <label>Должность</label>
      <input type="text" id="empRole" placeholder="Инструктор">
    </div>
  </div>
</div>

<div class="card">
  <h3>Выполненные работы (Минздрав)</h3>
  <div class="services-grid" id="servicesList"></div>
  
  <div class="totals-row">
    <div class="total-box">
      <div class="total-label">Итого к оплате</div>
      <div class="total-value" id="totalSum">0 $</div>
    </div>
  </div>
</div>

<div class="action-bar">
  <button class="btn btn-green" id="generateBtn">Сформировать отчет</button>
  <button class="btn btn-blue" id="copyBtn" style="display:none;">Копировать</button>
  <button class="btn btn-red" id="resetBtn">Сбросить</button>
</div>

<textarea class="report-area" id="reportArea" readonly></textarea>

<script>
  const $ = (id) => document.getElementById(id);

  $("backBtn").addEventListener("click", () => window.parent.postMessage({ action: "goBack" }, "*"));

  const SERVICES = [
    { id: "check_hosp", name: 'Проверка лечебного учреждения', price: 8000 },
    { id: "event_ems", name: 'Проведение мероприятия для EMS', price: 10000 },
    { id: "social_ems", name: 'Проведение соц. опроса для EMS', price: 6000 },
    { id: "check_ems", name: 'Проведение проверки EMS', price: 10000 },
    { id: "donor_day", name: 'Проведение Дня Донора', price: 15000 },
    { id: "briefing", name: 'Участие в брифинге EMS', price: 2000 }
  ];

  const list = $("servicesList");
  SERVICES.forEach(srv => {
    const div = document.createElement("div");
    div.className = "service-item";
    div.innerHTML = `
      <div class="service-info">
        <div class="service-name">${srv.name}</div>
        <div class="service-price">${srv.price.toLocaleString('ru-RU')} $</div>
      </div>
      <input type="number" class="service-input" id="inp_${srv.id}" min="0" value="0" data-price="${srv.price}" data-name="${srv.name}">
    `;
    list.appendChild(div);
  });

  function calculateTotal() {
    let total = 0;
    document.querySelectorAll('.service-input').forEach(input => {
      const count = parseInt(input.value) || 0;
      const price = parseInt(input.dataset.price);
      total += count * price;
    });
    $("totalSum").textContent = total.toLocaleString('ru-RU') + " $";
    return total;
  }

  document.querySelectorAll('.service-input').forEach(input => {
    input.addEventListener('input', calculateTotal);
  });

  $("generateBtn").addEventListener("click", () => {
    const name = $("empName").value.trim() || "Не указано";
    const passport = $("empPassport").value.trim() || "Не указано";
    const role = $("empRole").value.trim() || "Не указана";
    const total = calculateTotal();

    if (total === 0) {
      alert("Введите количество хотя бы для одной услуги!");
      return;
    }

    let text = `*** Работник: *** ${name}\n`;
    text += `*** Номер паспорта: *** ${passport}\n`;
    text += `*** Должность: *** ${role}\n`;
    text += `# Финансовый отчет :pencil: #\n\n`;
    text += `## ИТОГО: ${total.toLocaleString('ru-RU')} $\n\n`;
    text += `### 🏥 Выполненные работы ###\n`;

    document.querySelectorAll('.service-input').forEach(input => {
      const count = parseInt(input.value) || 0;
      if (count > 0) {
        const price = parseInt(input.dataset.price);
        const sum = count * price;
        text += `> ${input.dataset.name} (x${count}): ${sum.toLocaleString('ru-RU')} $\n`;
      }
    });

    $("reportArea").value = text;
    $("reportArea").style.display = "block";
    $("copyBtn").style.display = "flex";
    
    navigator.clipboard.writeText(text).then(() => {
      alert("✅ Отчет сформирован и скопирован!");
    });
  });

  $("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText($("reportArea").value);
    alert("✅ Скопировано!");
  });

  $("resetBtn").addEventListener("click", () => {
    $("empName").value = ""; $("empPassport").value = ""; $("empRole").value = "";
    document.querySelectorAll('.service-input').forEach(inp => inp.value = "0");
    calculateTotal();
    $("reportArea").style.display = "none";
    $("copyBtn").style.display = "none";
  });
</script>
</body>
</html>
