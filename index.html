<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планшет Больницы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel-2: #1c2839; --text: #e8eef7; --muted: #8496ab;
    --border: #26344a; --border-strong: #3a4a66; --accent: #2f9e44;
    --blue: #3b82f6; --red: #ef4444; --amber: #f59e0b; --purple: #8b5cf6;
    --discord: #5865F2; --error-bg: #4c1d1d; --error-text: #fecaca;
  }
  body { font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #16202e 0%, #0b0f14 60%); color: var(--text); min-height: 100vh; }
  .tablet { max-width: 1100px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #111823; border-x: 1px solid var(--border); }
  
  /* Статус-бар */
  .status-bar { display: flex; justify-content: space-between; padding: 8px 16px; background: #0a0e14; border-bottom: 1px solid var(--border); font-size: 0.78rem; }
  .status-right { display: flex; gap: 12px; align-items: center; }
  .wifi-icon { width: 18px; height: 18px; color: var(--accent); }
  .bat-body { width: 22px; height: 11px; border: 1px solid var(--muted); border-radius: 3px; display: inline-flex; padding: 1px; }
  .bat-level { background: var(--accent); height: 100%; border-radius: 1px; }
  .role-badge { font-size: 0.62rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .role-bog { background: #f59e0b; color: #1a1207; }
  .role-minister { background: #4c1d95; color: #ddd6fe; }
  .role-senior { background: #1e3a8a; color: #bfdbfe; }
  .role-worker { background: #14532d; color: #bbf7d0; }

  .header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: #16202e; border-bottom: 1px solid var(--border); }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--red); }
  .user-chip { display: none; align-items: center; gap: 8px; margin-left: auto; }
  .user-chip.visible { display: flex; }
  .logout-btn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; }

  /* Экраны */
  .body { flex: 1; padding: 20px; }
  .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
  .auth-card { width: 100%; max-width: 440px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 32px 26px; }
  .auth-card h1 { text-align: center; font-size: 1.3rem; margin-bottom: 4px; }
  .auth-card p { text-align: center; color: var(--muted); font-size: 0.84rem; margin-bottom: 24px; }
  
  .btn-discord { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: var(--discord); color: #fff; border-radius: 12px; font-weight: 700; text-decoration: none; margin-bottom: 14px; cursor: pointer; }
  .btn-discord svg { width: 24px; height: 24px; fill: currentColor; }
  .divider { text-align: center; color: var(--muted); font-size: 0.72rem; margin-bottom: 14px; }
  
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.72rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input, select { width: 100%; padding: 12px; font-size: 0.95rem; background: #0d1520; border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
  .btn-primary { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
  .notification { margin-top: 12px; padding: 11px; border-radius: 10px; font-size: 0.84rem; display: none; }
  .notification.show { display: block; }
  .notification.error { background: var(--error-bg); color: var(--error-text); }

  /* Рабочий стол */
  .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .app-tile { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 14px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 18px; cursor: pointer; text-align: center; }
  .app-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .app-icon svg { width: 30px; height: 30px; }
  .app-icon.blue { background: var(--blue); }
  .app-icon.amber { background: var(--amber); }
  .app-icon.red { background: var(--red); }
  .app-icon.gray { background: #64748b; }
  .app-icon.purple { background: var(--purple); }

  /* Админка */
  .user-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); }
  .btn-small { padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; background: var(--border); color: var(--text); border: none; cursor: pointer; }
  .btn-danger { background: #ef444433; color: #fca5a5; }

  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .modal { width: 100%; max-width: 420px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 26px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="tablet">
  <!-- СТАТУС-БАР -->
  <div class="status-bar">
    <div style="display:flex; gap:8px; align-items:center;">
      <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="0.9" fill="currentColor"/></svg>
      <span>Планшет в сети</span>
    </div>
    <div class="status-right">
      <span class="user-info hidden" id="statusUserBlock">
        <span id="statusLogin">—</span>
        <span class="role-badge" id="statusRole">—</span>
      </span>
      <span style="display:flex; align-items:center; gap:4px;">
        <span class="bat-body"><span class="bat-level" id="batLevel" style="width:100%"></span></span>
        <span id="batText">100%</span>
      </span>
      <span id="statusClock">--:--:--</span>
    </div>
  </div>

  <div class="header">
    <div class="logo"></div>
    <div><h1 style="font-size:1.05rem;">Планшет Больницы</h1></div>
    <div class="user-chip" id="userChip">
      <span id="userName">—</span>
      <button class="logout-btn" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="body">
    <!-- ЭКРАН ВХОДА -->
    <div class="auth-screen" id="authScreen">
      <div class="auth-card">
        <h1>Вход в планшет</h1>
        <p>Выберите способ авторизации</p>
        <a href="#" class="btn-discord" id="discordLoginBtn">
          <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
          Войти через Discord
        </a>
        <div class="divider">или</div>
        <form id="loginForm">
          <div class="form-group"><label>Логин</label><input type="text" id="loginInput" required></div>
          <div class="form-group"><label>Пароль</label><input type="password" id="passwordInput" required></div>
          <button type="submit" class="btn-primary" id="loginSubmit">Войти по логину</button>
          <div class="notification" id="loginNotification"></div>
        </form>
      </div>
    </div>

    <!-- РАБОЧИЙ СТОЛ -->
    <div class="desk-screen hidden" id="deskScreen">
      <div style="margin-bottom: 22px;">
        <h2 id="greetingTitle" style="font-size: 1.25rem;">Добро пожаловать</h2>
        <p id="greetingSub" style="color:var(--muted);font-size:0.86rem;">Выберите приложение</p>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </div>

    <!-- УНИВЕРСАЛЬНЫЙ ЭКРАН ДЛЯ ПРИЛОЖЕНИЙ -->
    <div class="app-screen hidden" id="appFrame">
      <div id="appHeader" style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
        <button class="btn-small" id="backToDeskBtn" style="display:flex; align-items:center; gap:6px; padding:8px 12px; font-weight:600; background:var(--panel-2); border:1px solid var(--border); cursor:pointer; color:white;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          Назад
        </button>
        <h2 id="currentAppTitle" style="font-size:1.2rem; margin:0;">Раздел</h2>
      </div>

      <div id="iframeContainer" style="width:100%; height: calc(100vh - 250px); background: #111823; border-radius: 16px; border: 1px solid var(--border); overflow: hidden;">
        <iframe id="appIframe" src="about:blank" style="width:100%; height:100%; border:none;"></iframe>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКА СМЕНЫ ПАРОЛЯ -->
<div class="modal-back hidden" id="forcePasswordModal">
  <div class="modal">
    <h2>Смените пароль</h2>
    <p style="text-align:center;color:var(--muted);font-size:0.84rem;margin-bottom:20px;">Вы вошли с временным паролем.</p>
    <form id="forcePasswordForm">
      <div class="form-group"><label>Новый пароль</label><input type="password" id="fpNew1" required></div>
      <div class="form-group"><label>Повторите</label><input type="password" id="fpNew2" required></div>
      <button type="submit" class="btn-primary" id="fpSubmit">Сменить пароль</button>
      <div class="notification" id="fpNotification"></div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  const WORKER_URL = "https://goverment.vadrgnuil.workers.dev"; 
  const SESSION_KEY = "hospital_session_v3";

  const $ = (id) => document.getElementById(id);

  function notify(el, msg, type) {
    el.textContent = msg;
    el.className = "notification show " + type;
    setTimeout(() => el.classList.remove("show"), 4000);
  }

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  // --- СЕССИЯ ---
  function saveSession(data) { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); }
  function loadSession() { try { const r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  // --- СПИСОК ПРИЛОЖЕНИЙ ---
  const APPS = [
    { id: 'staff', label: "МинЗдрава", sub: "Отдела", color: "blue", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>', roles: ['Бог', 'Министр здравоохранения', 'Старший состав', 'Сотрудник'] },
    { id: 'calc', label: "Калькулятор", sub: "Отчёт", color: "red", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="14" x2="16" y2="18"/></svg>', roles: ['Бог', 'Министр здравоохранения'] },
    { id: 'weekly', label: "Недельный отчет", sub: "Премии", color: "amber", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="19" x2="13" y2="19"/></svg>', roles: ['Бог', 'Министр здравоохранения'] },
    { id: 'users', label: "Учётные записи", sub: "Управление", color: "purple", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>', roles: ['Бог'] },
    { id: 'about', label: "О системе", sub: "Настройки", color: "gray", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>', roles: ['Бог', 'Министр здравоохранения', 'Старший состав', 'Сотрудник'] }
  ];

  // --- ОТОБРАЖЕНИЕ ЭКРАНОВ ---
  function showAuth() {
    $("authScreen").classList.remove("hidden");
    $("deskScreen").classList.add("hidden");
    $("appFrame").classList.add("hidden");
    $("userChip").classList.remove("visible");
    $("statusUserBlock").classList.add("hidden");
    $("loginForm").reset();
  }

  function showDesk(session) {
    $("authScreen").classList.add("hidden");
    $("deskScreen").classList.remove("hidden");
    $("appFrame").classList.add("hidden");
    $("userChip").classList.add("visible");
    $("userName").textContent = session.login;
    
    $("statusUserBlock").classList.remove("hidden");
    $("statusLogin").textContent = session.login;
    
    const badge = $("statusRole");
    badge.textContent = session.role;
    badge.className = "role-badge";
    if (session.role === 'Бог') badge.classList.add('role-bog');
    else if (session.role === 'Министр здравоохранения') badge.classList.add('role-minister');
    else if (session.role === 'Старший состав') badge.classList.add('role-senior');
    else badge.classList.add('role-worker');

    $("greetingTitle").textContent = "Добро пожаловать, " + session.login;
    $("greetingSub").textContent = "Роль: " + session.role;

    const grid = $("appGrid");
    grid.innerHTML = "";
    
    APPS.forEach(a => {
      if (a.roles && !a.roles.includes(session.role)) return;
      
      const tile = document.createElement("div");
      tile.className = "app-tile";
      tile.innerHTML = `<div class="app-icon ${a.color}">${a.icon}</div><div class="label">${a.label}</div><div class="sub">${a.sub}</div>`;
      
      tile.addEventListener("click", () => {
        if (a.id === 'users') {
          $("authScreen").classList.add("hidden"); 
          $("deskScreen").classList.add("hidden");
          $("appFrame").classList.remove("hidden");
          $("appHeader").classList.remove("hidden"); 
          $("currentAppTitle").textContent = a.label; 
          $("appIframe").src = "apps/users.html?v=" + Date.now(); 
        } 
        else if (a.id === 'weekly') {
          $("authScreen").classList.add("hidden"); 
          $("deskScreen").classList.add("hidden");
          $("appFrame").classList.remove("hidden");
          $("appHeader").classList.remove("hidden"); 
          $("currentAppTitle").textContent = a.label; 
          $("appIframe").src = "apps/weekly.html?v=" + Date.now();
        }
        else if (a.id === 'about') {
          $("authScreen").classList.add("hidden"); 
          $("deskScreen").classList.add("hidden");
          $("appFrame").classList.remove("hidden");
          $("appHeader").classList.remove("hidden"); 
          $("currentAppTitle").textContent = a.label; 
          $("appIframe").src = `apps/about.html?user=${session.login}&role=${session.role}&v=${Date.now()}`; 
        }
        else if (a.id === 'staff') {
          $("authScreen").classList.add("hidden"); 
          $("deskScreen").classList.add("hidden");
          $("appFrame").classList.remove("hidden");
          $("appHeader").classList.remove("hidden"); 
          $("currentAppTitle").textContent = a.label; 
          $("appIframe").src = `apps/staff.html?role=${session.role}&v=${Date.now()}`; 
        }
        else if (a.id === 'calc') {
          $("authScreen").classList.add("hidden"); 
          $("deskScreen").classList.add("hidden");
          $("appFrame").classList.remove("hidden");
          $("appHeader").classList.remove("hidden"); 
          $("currentAppTitle").textContent = a.label; 
          $("appIframe").src = "apps/calculator.html?v=" + Date.now(); 
        }
      });
          
      grid.appendChild(tile);
    });
  }

  // --- ВХОД ПО ЛОГИНУ ---
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const login = $("loginInput").value.trim().toLowerCase();
    const pass = $("passwordInput").value;
    const btn = $("loginSubmit");
    
    btn.disabled = true; btn.textContent = "Стучимся на сервер…";

    try {
      const hash = await sha256Hex(pass);
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "login", login: login, hash: hash })
      });
      
      const data = await res.json();

      if (!data.success) {
        notify($("loginNotification"), data.message || "Неверный логин или пароль", "error");
        return;
      }

      saveSession({ login: data.login, role: data.role, department: data.department || "МинЗдрав", ts: Date.now() });

      if (data.isTemp) {
        $("authScreen").classList.add("hidden");
        $("forcePasswordModal").classList.remove("hidden");
      } else {
        showDesk(data);
      }
    } catch (err) {
      notify($("loginNotification"), "Ошибка сети. Сервер не отвечает.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Войти по логину";
    }
  });

  // --- КНОПКА DISCORD ---
  $("discordLoginBtn").addEventListener("click", (e) => {
    e.preventDefault();
    const redirectUrl = encodeURIComponent(window.location.origin + window.location.pathname);
    window.location.href = `${WORKER_URL}/auth/discord?redirect=${redirectUrl}`;
  });

  // --- СМЕНА ПАРОЛЯ ---
  $("forcePasswordForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = $("fpNew1").value;
    const p2 = $("fpNew2").value;
    
    if (p1 !== p2) return notify($("fpNotification"), "Пароли не совпадают", "error");
    if (p1 === "12345" || p1.length < 4) return notify($("fpNotification"), "Пароль ненадежный", "error");

    const btn = $("fpSubmit");
    btn.disabled = true; btn.textContent = "Сохранение…";

    try {
      const hash = await sha256Hex(p1);
      const session = loadSession();
      
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "changePassword", login: session.login, newHash: hash })
      });
      const data = await res.json();

      if (!data.success) return notify($("fpNotification"), "Ошибка сохранения", "error");

      $("forcePasswordModal").classList.add("hidden");
      showDesk(session);
      showToast("Пароль успешно изменен!");
    } catch (err) {
      notify($("fpNotification"), "Ошибка сети", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Сменить пароль";
    }
  });

  // --- ЧАСЫ И БАТАРЕЯ ---
  setInterval(() => {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    $("statusClock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }, 1000);

  if (navigator.getBattery) {
    navigator.getBattery().then((battery) => {
      const render = () => {
        const pct = Math.round(battery.level * 100);
        $("batText").textContent = pct + "%";
        $("batLevel").style.width = Math.max(2, pct) + "%";
      };
      render();
      battery.addEventListener("levelchange", render);
    });
  }

  $("logoutBtn").addEventListener("click", () => {
    clearSession();
    $("appFrame").classList.add("hidden");
    $("appHeader").classList.add("hidden");
    $("appIframe").src = "about:blank"; 
    showAuth();
  });

  $("backToDeskBtn").addEventListener("click", () => {
    $("appFrame").classList.add("hidden");
    $("deskScreen").classList.remove("hidden");
    $("appIframe").src = "about:blank";
  });

  // --- ПРОВЕРКА URL (ВОЗВРАТ ОТ DISCORD) ---
  const urlParams = new URLSearchParams(window.location.search);
  const urlLogin = urlParams.get('login');
  const urlRole = urlParams.get('role');
  const urlDept = urlParams.get('dept') || 'МинЗдрав';

  if (urlLogin && urlRole) {
    // Пользователь вернулся с Discord
    const session = { login: urlLogin, role: urlRole, department: urlDept, ts: Date.now() };
    saveSession(session);
    window.history.replaceState({}, document.title, window.location.pathname);
    showDesk(session);
  } else {
    // Обычный запуск
    const session = loadSession();
    if (session) {
      showDesk(session);
    } else {
      showAuth();
    }
  }

})();
</script>
</body>
</html>
