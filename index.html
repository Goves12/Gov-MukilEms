<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планшет Больницы — Вход</title>
<style>
  /* ============ БАЗА ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f14;
    --panel-2: #1c2839;
    --text: #e8eef7;
    --muted: #8496ab;
    --border: #26344a;
    --border-strong: #3a4a66;
    --accent: #2f9e44;
    --accent-2: #37b24d;
    --blue: #3b82f6;
    --red: #ef4444;
    --amber: #f59e0b;
    --purple: #8b5cf6;
    --discord: #5865F2;
    --success-bg: #14532d;
    --success-text: #bbf7d0;
    --error-bg: #4c1d1d;
    --error-text: #fecaca;
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #16202e 0%, #0b0f14 60%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .tablet {
    max-width: 1100px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #111823 0%, #0b0f14 100%);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ============ ШАПКА ============ */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: linear-gradient(180deg, #16202e 0%, #1c2839 100%);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%);
    position: relative; flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(220,38,38,.25), 0 4px 12px rgba(0,0,0,.4);
  }
  .logo::before, .logo::after {
    content: ""; position: absolute; background: #fff; border-radius: 2px;
  }
  .logo::before { width: 22px; height: 6px; top: 18px; left: 10px; }
  .logo::after  { width: 6px; height: 22px; top: 10px; left: 18px; }

  .title { flex: 1; min-width: 0; }
  .title h1 { font-size: 1.05rem; font-weight: 700; }
  .title .sub { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

  .user-chip {
    display: none; align-items: center; gap: 8px;
    padding: 6px 10px 6px 6px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; font-size: 0.8rem;
  }
  .user-chip.visible { display: flex; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), #1d4ed8);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.78rem; color: #fff; text-transform: uppercase; overflow: hidden;
  }
  .logout-btn {
    padding: 5px 10px; font-size: 0.72rem; background: transparent; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); cursor: pointer; font-family: inherit; transition: background .15s;
  }
  .logout-btn:hover { background: var(--panel); }

  /* ============ ОСНОВНОЕ ============ */
  .body { flex: 1; padding: 20px; }

  /* ============ ЭКРАН ВХОДА ============ */
  .auth-screen {
    min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-card {
    width: 100%; max-width: 440px; background: linear-gradient(180deg, #16202e 0%, #1c2839 100%);
    border: 1px solid var(--border); border-radius: 20px; padding: 32px 26px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); position: relative; overflow: hidden;
  }
  .auth-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #dc2626, #2f9e44, #3b82f6);
  }
  .auth-emblem {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px;
    background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%); position: relative;
    box-shadow: 0 0 0 3px rgba(220,38,38,.2), 0 8px 24px rgba(220,38,38,.35);
  }
  .auth-emblem::before, .auth-emblem::after { content: ""; position: absolute; background: #fff; border-radius: 3px; }
  .auth-emblem::before { width: 34px; height: 9px; top: 27px; left: 15px; }
  .auth-emblem::after  { width: 9px; height: 34px; top: 15px; left: 27px; }

  .auth-card h1 { font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
  .auth-card .subtitle { color: var(--muted); font-size: 0.84rem; margin-bottom: 24px; text-align: center; }

  /* Плашка с двумя вариантами */
  .login-options { display: flex; flex-direction: column; gap: 14px; }

  .btn-discord {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    padding: 14px; background: var(--discord); color: #fff; text-decoration: none;
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background .2s, transform .1s;
  }
  .btn-discord svg { width: 24px; height: 24px; flex-shrink: 0; fill: currentColor; }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.72rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 12px 14px; font-size: 0.95rem; font-family: inherit;
    color: var(--text); background: #0d1520; border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(47,158,68,.22); }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 13px;
    background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background .15s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-2); }

  .notification { margin-top: 12px; padding: 11px 14px; border-radius: 10px; font-size: 0.84rem; font-weight: 500; display: none; }
  .notification.show { display: block; }
  .notification.error { background: var(--error-bg); color: var(--error-text); }

  .auth-foot { margin-top: 20px; font-size: 0.72rem; color: var(--muted); text-align: center; }

  /* ============ ПЛАНШЕТ ============ */
  .desk-screen { padding: 6px 4px; }
  .greeting { margin-bottom: 22px; }
  .greeting h2 { font-size: 1.25rem; font-weight: 700; }
  .greeting p { color: var(--muted); font-size: 0.86rem; margin-top: 2px; }

  .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .app-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px 14px;
    background: linear-gradient(180deg, #16202e 0%, #1c2839 100%); border: 1px solid var(--border);
    border-radius: 18px; cursor: pointer; text-align: center; transition: transform .12s;
  }
  .app-tile:hover { transform: translateY(-2px); border-color: var(--border-strong); }
  .app-icon {
    width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .app-icon svg { width: 30px; height: 30px; }
  .app-icon.blue   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .app-icon.amber  { background: linear-gradient(135deg, #f59e0b, #b45309); }
  .app-icon.red    { background: linear-gradient(135deg, #ef4444, #991b1b); }
  .app-icon.gray   { background: linear-gradient(135deg, #64748b, #334155); }
  .app-tile .label { font-size: .88rem; font-weight: 600; }
  .app-tile .sub { font-size: .72rem; color: var(--muted); }

  .hidden { display: none !important; }

  /* ============ МОДАЛКА СМЕНЫ ПАРОЛЯ ============ */
  .modal-back {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 10000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    width: 100%; max-width: 420px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 20px; padding: 26px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.8); position: relative;
  }
  .modal-emblem {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px;
    background: linear-gradient(135deg, #f59e0b, #b45309); display: flex; align-items: center; justify-content: center;
  }
  .modal-emblem svg { width: 28px; height: 28px; color: #fff; }
  .modal h2 { text-align: center; font-size: 1.15rem; margin-bottom: 6px; }
  .modal .modal-sub { text-align: center; color: var(--muted); font-size: 0.84rem; margin-bottom: 20px; }

  @media (max-width: 600px) {
    .app-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
</style>
</head>
<body>

<div class="tablet">
  <div class="header">
    <div class="logo"></div>
    <div class="title">
      <h1>Планшет Больницы</h1>
      <div class="sub">Россия Онлайн · Служба здравоохранения</div>
    </div>
    <div class="user-chip" id="userChip">
      <div class="avatar" id="userAvatar">?</div>
      <span id="userName">—</span>
      <button class="logout-btn" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="body">
    <!-- ================= ЭКРАН ВХОДА ================= -->
    <div class="auth-screen" id="authScreen">
      <div class="auth-card">
        <div class="auth-emblem"></div>
        <h1>Вход в планшет</h1>
        <p class="subtitle">Выберите способ авторизации</p>

        <div class="login-options">
          <!-- Discord -->
          <a href="#" class="btn-discord" id="discordLoginBtn">
            <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
            Войти через Discord
          </a>

          <div class="divider">или</div>

          <!-- Логин / пароль -->
          <form id="loginForm">
            <div class="form-group">
              <label for="loginInput">Логин</label>
              <input type="text" id="loginInput" required autocomplete="username">
            </div>
            <div class="form-group">
              <label for="passwordInput">Пароль</label>
              <input type="password" id="passwordInput" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary" id="loginSubmit">Войти по логину</button>
            <div class="notification" id="loginNotification"></div>
          </form>
        </div>

        <div class="auth-foot">Доступ только для сотрудников</div>
      </div>
    </div>

    <!-- ================= РАБОЧИЙ СТОЛ ================= -->
    <div class="desk-screen hidden" id="deskScreen">
      <div class="greeting">
        <h2 id="greetingTitle">Добро пожаловать</h2>
        <p id="greetingSub">Выберите приложение</p>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </div>
  </div>
</div>

<!-- ============ МОДАЛКА СМЕНЫ ПАРОЛЯ ============ -->
<div class="modal-back hidden" id="forcePasswordModal">
  <div class="modal">
    <div class="modal-emblem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <h2>Смените пароль</h2>
    <p class="modal-sub">Вы вошли с временным паролем. Пока вы его не смените, доступ к планшету закрыт.</p>

    <form id="forcePasswordForm">
      <div class="form-group">
        <label for="fpNew1">Новый пароль</label>
        <input type="password" id="fpNew1" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="fpNew2">Повторите новый пароль</label>
        <input type="password" id="fpNew2" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="fpSubmit">Сменить пароль и продолжить</button>
      <div class="notification" id="fpNotification"></div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ============================================================
  //  НАСТРОЙКИ
  // ============================================================
  const WORKER_URL = "https://goverment.vadrgnuil.workers.dev";
  const REDIRECT_AFTER_LOGIN = window.location.origin + window.location.pathname;
  const SESSION_KEY = "hospital_session_v2";
  const PASSWORDS_KEY = "hospital_passwords_db";

  // Хэш от "12345" (начальный пароль)
  const TEMP_PASSWORD_HASH = "5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5";

  const $ = (id) => document.getElementById(id);

  const authScreen = $("authScreen");
  const deskScreen = $("deskScreen");
  const userChip = $("userChip");
  const userAvatar = $("userAvatar");
  const userName = $("userName");
  const logoutBtn = $("logoutBtn");
  const discordLoginBtn = $("discordLoginBtn");
  const loginForm = $("loginForm");
  const loginInput = $("loginInput");
  const passwordInput = $("passwordInput");
  const loginSubmit = $("loginSubmit");
  const loginNotification = $("loginNotification");
  const greetingTitle = $("greetingTitle");
  const greetingSub = $("greetingSub");
  const appGrid = $("appGrid");

  const forcePasswordModal = $("forcePasswordModal");
  const forcePasswordForm = $("forcePasswordForm");
  const fpNew1 = $("fpNew1");
  const fpNew2 = $("fpNew2");
  const fpSubmit = $("fpSubmit");
  const fpNotification = $("fpNotification");

  // ============================================================
  //  ПРИЛОЖЕНИЯ
  // ============================================================
  const APPS = [
    {
      label: "Персонал", sub: "Список сотрудников", color: "blue",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
    },
    {
      label: "Отпуска", sub: "IC · OOC", color: "amber",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 15l2 2 4-4"/></svg>'
    },
    {
      label: "Калькулятор", sub: "Баллы · отчёт", color: "red",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="14" x2="16" y2="18"/></svg>'
    },
    {
      label: "О системе", sub: "Настройки", color: "gray",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    }
  ];

  // ============================================================
  //  УТИЛИТЫ
  // ============================================================
  function notify(el, message, type) {
    el.textContent = message;
    el.className = "notification show " + type;
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 4500);
  }

  // SHA-256 (встроенный в браузер)
  async function sha256Hex(text) {
    if (window.crypto && window.crypto.subtle) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest("SHA-256", enc.encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    throw new Error("SHA-256 недоступен");
  }

  // ============================================================
  //  ЛОКАЛЬНАЯ БАЗА ПАРОЛЕЙ (localStorage)
  // ============================================================
  function getPasswordHash(login) {
    try {
      const db = JSON.parse(localStorage.getItem(PASSWORDS_KEY) || "{}");
      return db[login.toLowerCase()] || null;
    } catch (e) { return null; }
  }

  function setPasswordHash(login, hash) {
    try {
      const db = JSON.parse(localStorage.getItem(PASSWORDS_KEY) || "{}");
      db[login.toLowerCase()] = hash;
      localStorage.setItem(PASSWORDS_KEY, JSON.stringify(db));
    } catch (e) {}
  }

  // ============================================================
  //  СЕССИЯ
  // ============================================================
  function saveSession(data) { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); }
  function loadSession() {
    try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  // ============================================================
  //  РЕНДЕР
  // ============================================================
  function renderApps() {
    appGrid.innerHTML = "";
    APPS.forEach((a) => {
      const tile = document.createElement("div");
      tile.className = "app-tile";
      tile.innerHTML = `<div class="app-icon ${a.color}">${a.icon}</div><div class="label">${a.label}</div><div class="sub">${a.sub}</div>`;
      tile.addEventListener("click", () => alert("Приложение " + a.label + " в разработке"));
      appGrid.appendChild(tile);
    });
  }

  function showAuth() {
    authScreen.classList.remove("hidden");
    deskScreen.classList.add("hidden");
    userChip.classList.remove("visible");
    loginForm.reset();
    loginNotification.classList.remove("show");
  }

  function showDesk(session) {
    authScreen.classList.add("hidden");
    deskScreen.classList.remove("hidden");
    userChip.classList.add("visible");
    userName.textContent = session.login;
    userAvatar.textContent = (session.login || "?").charAt(0).toUpperCase();
    greetingTitle.textContent = "Добро пожаловать, " + session.login;
    greetingSub.textContent = "Выберите приложение";
    renderApps();
  }

  // ============================================================
  //  ВХОД ПО ЛОГИНУ / ПАРОЛЮ
  // ============================================================
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const login = loginInput.value.trim();
    const password = passwordInput.value;
    if (!login || !password) return;

    loginSubmit.disabled = true;
    loginSubmit.textContent = "Проверка…";

    try {
      const hash = await sha256Hex(password);
      let isSuccess = false;
      let mustChange = false;

      if (login.toLowerCase() === "todd") {
        // Проверяем, менял ли он уже пароль
        const savedHash = getPasswordHash("todd");
        
        if (savedHash) {
          // Если менял — проверяем совпадение
          if (hash === savedHash) isSuccess = true;
        } else {
          // Если не менял — пускаем только с 12345
          if (hash === TEMP_PASSWORD_HASH) {
            isSuccess = true;
            mustChange = true; // Требуем смену
          }
        }
      } else {
        notify(loginNotification, "Неизвестный пользователь. Попробуйте Todd.", "error");
        return;
      }

      if (!isSuccess) {
        notify(loginNotification, "Неверный логин или пароль", "error");
        return;
      }

      // Сохраняем сессию
      const session = { login: login, role: "user", ts: Date.now() };
      saveSession(session);

      if (mustChange) {
        // Показываем модалку смены пароля
        authScreen.classList.add("hidden");
        forcePasswordModal.classList.remove("hidden");
        setTimeout(() => fpNew1.focus(), 100);
      } else {
        // Пускаем на рабочий стол
        showDesk(session);
      }

    } catch (err) {
      console.error(err);
      notify(loginNotification, "Ошибка: " + err.message, "error");
    } finally {
      loginSubmit.disabled = false;
      loginSubmit.textContent = "Войти по логину";
    }
  });

  // ============================================================
  //  ПРИНУДИТЕЛЬНАЯ СМЕНА ПАРОЛЯ
  // ============================================================
  forcePasswordForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = fpNew1.value;
    const p2 = fpNew2.value;

    if (!p1 || !p2) { notify(fpNotification, "Заполните все поля", "error"); return; }
    if (p1.length < 4) { notify(fpNotification, "Пароль слишком короткий (мин. 4)", "error"); return; }
    if (p1 !== p2) { notify(fpNotification, "Пароли не совпадают", "error"); return; }
    if (p1 === "12345") { notify(fpNotification, "Нельзя использовать 12345", "error"); return; }

    fpSubmit.disabled = true;
    fpSubmit.textContent = "Сохранение…";

    try {
      const newHash = await sha256Hex(p1);
      setPasswordHash("todd", newHash); // Сохраняем новый пароль локально

      notify(fpNotification, "Пароль успешно изменён!", "success");

      setTimeout(() => {
        forcePasswordModal.classList.add("hidden");
        fpNew1.value = "";
        fpNew2.value = "";
        fpNotification.classList.remove("show");
        
        const session = loadSession();
        if (session) showDesk(session);
      }, 1000);

    } catch (err) {
      notify(fpNotification, "Ошибка сохранения", "error");
    } finally {
      fpSubmit.disabled = false;
      fpSubmit.textContent = "Сменить пароль и продолжить";
    }
  });

  // ============================================================
  //  СТАРТ
  // ============================================================
  function init() {
    // Кнопка Discord (заглушка для этого теста)
    discordLoginBtn.addEventListener("click", (e) => {
      e.preventDefault();
      alert("Вход через Discord будет добавлен позже.");
    });

    // Выход
    logoutBtn.addEventListener("click", () => {
      clearSession();
      showAuth();
    });

    // Если есть активная сессия — сразу в планшет
    const session = loadSession();
    if (session) {
      showDesk(session);
    } else {
      showAuth();
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
