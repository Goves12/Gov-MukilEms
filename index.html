<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планшет Больницы — Вход</title>
<style>
  /* ============ БАЗА ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f14; --panel-2: #1c2839; --text: #e8eef7; --muted: #8496ab;
    --border: #26344a; --border-strong: #3a4a66; --accent: #2f9e44;
    --accent-2: #37b24d; --blue: #3b82f6; --red: #ef4444; --amber: #f59e0b;
    --purple: #8b5cf6; --discord: #5865F2; --success-bg: #14532d;
    --success-text: #bbf7d0; --error-bg: #4c1d1d; --error-text: #fecaca;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #16202e 0%, #0b0f14 60%);
    color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .tablet { max-width: 1100px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(180deg, #111823 0%, #0b0f14 100%); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  
  /* Статус-бар */
  .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #0a0e14; border-bottom: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); position: sticky; top: 0; z-index: 20; }
  .status-left, .status-right { display: flex; align-items: center; gap: 12px; }
  .status-bar .net-indicator { display: inline-flex; align-items: center; gap: 8px; }
  .status-bar .wifi-icon { width: 18px; height: 18px; color: #2f9e44; animation: wifiPulse 2s infinite; }
  @keyframes wifiPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .status-bar .clock { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
  .status-bar .battery { display: inline-flex; align-items: center; gap: 6px; }
  .status-bar .bat-body { width: 22px; height: 11px; border: 1.5px solid var(--muted); border-radius: 3px; padding: 1px; display: flex; align-items: center; }
  .status-bar .bat-level { height: 100%; background: #2f9e44; border-radius: 1px; }
  .status-bar .role-badge { font-size: 0.62rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .role-bog { background: linear-gradient(135deg, #f59e0b, #b45309); color: #1a1207; }
  .role-minister { background: #4c1d95; color: #ddd6fe; }
  .role-senior { background: #1e3a8a; color: #bfdbfe; }
  .role-worker { background: #14532d; color: #bbf7d0; }
  .role-vesti { background: #64748b; color: #f1f5f9; }

  /* Шапка */
  .header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: linear-gradient(180deg, #16202e 0%, #1c2839 100%); border-bottom: 1px solid var(--border); }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%); position: relative; }
  .logo::before, .logo::after { content: ""; position: absolute; background: #fff; border-radius: 2px; }
  .logo::before { width: 22px; height: 6px; top: 18px; left: 10px; }
  .logo::after { width: 6px; height: 22px; top: 10px; left: 18px; }
  .title h1 { font-size: 1.05rem; font-weight: 700; }
  .title .sub { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
  .user-chip { display: none; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; font-size: 0.8rem; margin-left: auto; }
  .user-chip.visible { display: flex; }
  .logout-btn { padding: 5px 10px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; }

  /* Экраны */
  .body { flex: 1; padding: 20px; }
  .auth-screen { min-height: 60vh; display: flex; align-items: center; justify-content: center; }
  .auth-card { width: 100%; max-width: 440px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 32px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .auth-card h1 { font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
  .auth-card .subtitle { color: var(--muted); font-size: 0.84rem; margin-bottom: 24px; text-align: center; }
  .btn-discord { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: var(--discord); color: #fff; text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 700; margin-bottom: 14px; }
  .btn-discord svg { width: 24px; height: 24px; fill: currentColor; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; margin-bottom: 14px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 0.72rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; }
  input, select { width: 100%; padding: 12px 14px; font-size: 0.95rem; color: var(--text); background: #0d1520; border: 1px solid var(--border); border-radius: 10px; outline: none; }
  input:focus { border-color: var(--accent-2); }
  .btn-primary { display: flex; align-items: center; justify-content: center; width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .notification { margin-top: 12px; padding: 11px; border-radius: 10px; font-size: 0.84rem; display: none; }
  .notification.show { display: block; }
  .notification.error { background: var(--error-bg); color: var(--error-text); }
  .notification.success { background: var(--success-bg); color: var(--success-text); }

  /* Рабочий стол */
  .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .app-tile { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 14px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 18px; cursor: pointer; text-align: center; transition: transform .12s; }
  .app-tile:hover { transform: translateY(-2px); border-color: var(--border-strong); }
  .app-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .app-icon svg { width: 30px; height: 30px; }
  .app-icon.blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
  .app-icon.amber { background: linear-gradient(135deg, #f59e0b, #b45309); }
  .app-icon.red { background: linear-gradient(135deg, #ef4444, #991b1b); }
  .app-icon.gray { background: linear-gradient(135deg, #64748b, #334155); }
  .app-icon.purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
  .app-tile .label { font-size: .88rem; font-weight: 600; }
  .app-tile .sub { font-size: .72rem; color: var(--muted); }

  /* Админка */
  .user-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .btn-small { padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; background: var(--border); color: var(--text); border: none; cursor: pointer; }
  .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

  /* Модалка */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { width: 100%; max-width: 420px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 26px 22px; }
  .modal h2 { text-align: center; margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="tablet">
  <div class="status-bar">
    <div class="status-left">
      <span class="net-indicator">
        <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="0.9" fill="currentColor"/></svg>
        <span id="statusNetwork">Планшет в сети</span>
      </span>
    </div>
    <div class="status-right">
      <span class="user-info hidden" id="statusUserBlock">
        <span id="statusLogin">—</span>
        <span class="role-badge" id="statusRole">—</span>
      </span>
      <span class="battery">
        <span class="bat-body"><span class="bat-level" id="batLevel" style="width:100%"></span></span>
        <span id="batText">100%</span>
      </span>
      <span class="clock" id="statusClock">--:--:--</span>
    </div>
  </div>

  <div class="header">
    <div class="logo"></div>
    <div class="title">
      <h1>Планшет Больницы</h1>
      <div class="sub">Россия Онлайн · Служба здравоохранения</div>
    </div>
    <div class="user-chip" id="userChip">
      <div class="avatar" id="userAvatar" style="width:26px;height:26px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;">?</div>
      <span id="userName">—</span>
      <button class="logout-btn" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="body">
    <!-- ЭКРАН ВХОДА -->
    <div class="auth-screen" id="authScreen">
      <div class="auth-card">
        <h1>Вход в планшет</h1>
        <p class="subtitle">Выберите способ авторизации</p>
        <a href="#" class="btn-discord" id="discordLoginBtn">
          <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.096 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
          Войти через Discord
        </a>
        <div class="divider">или</div>
        <form id="loginForm">
          <div class="form-group"><label>Логин</label><input type="text" id="loginInput" required></div>
          <div class="form-group"><label>Пароль</label><input type="password" id="passwordInput" required></div>
          <button type="submit" class="btn-primary" id="loginSubmit">Войти по логину</button>
          <div class="notification" id="loginNotification"></div>
        </form>
      </div>
    </div>

    <!-- РАБОЧИЙ СТОЛ -->
    <div class="desk-screen hidden" id="deskScreen">
      <div style="margin-bottom: 22px;">
        <h2 id="greetingTitle" style="font-size: 1.25rem;">Добро пожаловать</h2>
        <p id="greetingSub" style="color:var(--muted);font-size:0.86rem;">Выберите приложение</p>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </div>

    <!-- УЧЁТНЫЕ ЗАПИСИ -->
    <div class="app-screen hidden" id="usersScreen">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-size:1.2rem;">Учётные записи</h2>
        <button class="btn-primary" id="addUserBtn" style="width:auto; padding:8px 16px;">+ Добавить</button>
      </div>
      <div id="usersList" style="background:var(--panel-2); border:1px solid var(--border); border-radius:12px;"></div>
      <div id="userFormBlock" class="hidden" style="margin-top:20px; background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:20px;">
        <h3 id="userFormTitle" style="margin-bottom:15px;">Новый пользователь</h3>
        <input type="hidden" id="editUserLogin">
        <div class="form-group"><label>Логин</label><input type="text" id="newUserLogin"></div>
        <div class="form-group"><label>Временный пароль</label><input type="text" id="newUserPassword" placeholder="12345"></div>
        <div class="form-group"><label>Роль</label>
          <select id="newUserRole">
            <option value="Сотрудник">Сотрудник</option>
            <option value="Старший состав">Старший состав</option>
            <option value="Министр здравоохранения">Министр здравоохранения</option>
            <option value="Бог">Бог</option>
          </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button class="btn-primary" id="saveUserBtn">Сохранить</button>
          <button class="btn-primary" id="cancelUserBtn" style="background:var(--muted);">Отмена</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКА СМЕНЫ ПАРОЛЯ -->
<div class="modal-back hidden" id="forcePasswordModal">
  <div class="modal">
    <h2>Смените пароль</h2>
    <p style="text-align:center;color:var(--muted);font-size:0.84rem;margin-bottom:20px;">Вы вошли с временным паролем.</p>
    <form id="forcePasswordForm">
      <div class="form-group"><label>Новый пароль</label><input type="password" id="fpNew1" required></div>
      <div class="form-group"><label>Повторите</label><input type="password" id="fpNew2" required></div>
      <button type="submit" class="btn-primary" id="fpSubmit">Сменить пароль</button>
      <div class="notification" id="fpNotification"></div>
    </form>
  </div>
</div>
<script>
(function () {
  "use strict";

  const SESSION_KEY = "hospital_session_v2";
  const USERS_DB_KEY = "hospital_users_db";
  const TEMP_PASSWORD_HASH = "5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5"; // хэш 12345

  const $ = (id) => document.getElementById(id);

  // --- УТИЛИТЫ ---
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function notify(el, msg, type) {
    el.textContent = msg; el.className = "notification show " + type;
    setTimeout(() => el.classList.remove("show"), 4000);
  }

  // --- БАЗА ПОЛЬЗОВАТЕЛЕЙ ---
  function getUsersDB() {
    try {
      const raw = localStorage.getItem(USERS_DB_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    // Если база пустая, создаем Todd
    return [{ login: 'todd', hash: TEMP_PASSWORD_HASH, role: 'Бог', isTemp: true }];
  }
  function saveUsersDB(db) {
    localStorage.setItem(USERS_DB_KEY, JSON.stringify(db));
  }

  // --- СЕССИЯ ---
  function saveSession(data) { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); }
  function loadSession() {
    try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
  }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  // --- СПИСОК ПРИЛОЖЕНИЙ ---
  const APPS = [
    { id: 'staff', label: "Персонал", sub: "Список", color: "blue", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>', roles: ['Бог', 'Министр здравоохранения', 'Старший состав', 'Сотрудник'] },
    { id: 'calc', label: "Калькулятор", sub: "Отчёт", color: "red", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="14" x2="16" y2="18"/></svg>', roles: ['Бог', 'Министр здравоохранения'] },
    { id: 'weekly', label: "Недельный отчет", sub: "Статистика", color: "amber", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="19" x2="13" y2="19"/></svg>', roles: ['Бог', 'Министр здравоохранения'] },
    { id: 'users', label: "Учётные записи", sub: "Управление", color: "purple", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>', roles: ['Бог'] },
    { id: 'about', label: "О системе", sub: "Настройки", color: "gray", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>', roles: ['Бог', 'Министр здравоохранения', 'Старший состав', 'Сотрудник'] }
  ];

  // --- РЕНДЕР ---
  function showAuth() {
    $("authScreen").classList.remove("hidden");
    $("deskScreen").classList.add("hidden");
    $("usersScreen").classList.add("hidden");
    $("userChip").classList.remove("visible");
    $("statusUserBlock").classList.add("hidden");
    $("loginForm").reset();
  }

  function showDesk(session) {
    $("authScreen").classList.add("hidden");
    $("deskScreen").classList.remove("hidden");
    $("usersScreen").classList.add("hidden");
    $("userChip").classList.add("visible");
    $("userName").textContent = session.login;
    $("userAvatar").textContent = session.login.charAt(0).toUpperCase();

    $("statusUserBlock").classList.remove("hidden");
    $("statusLogin").textContent = session.login;
    
    const badge = $("statusRole");
    badge.textContent = session.role;
    badge.className = "role-badge";
    if (session.role === 'Бог') badge.classList.add('role-bog');
    else if (session.role === 'Министр здравоохранения') badge.classList.add('role-minister');
    else if (session.role === 'Старший состав') badge.classList.add('role-senior');
    else badge.classList.add('role-worker');

    $("greetingTitle").textContent = "Добро пожаловать, " + session.login;
    $("greetingSub").textContent = "Роль: " + session.role;

    const grid = $("appGrid");
    grid.innerHTML = "";
    APPS.forEach(a => {
      if (a.roles && !a.roles.includes(session.role)) return;
      const tile = document.createElement("div");
      tile.className = "app-tile";
      tile.innerHTML = `<div class="app-icon ${a.color}">${a.icon}</div><div class="label">${a.label}</div><div class="sub">${a.sub}</div>`;
      tile.addEventListener("click", () => {
        if (a.id === 'users') showUsersScreen();
        else if (a.id === 'calc') window.open("calculator.html", "_blank");
        else alert("В разработке");
      });
      grid.appendChild(tile);
    });
  }

  // --- ВХОД ---
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const login = $("loginInput").value.trim().toLowerCase();
    const pass = $("passwordInput").value;
    const btn = $("loginSubmit");
    btn.disabled = true; btn.textContent = "Проверка…";

    try {
      const hash = await sha256Hex(pass);
      const db = getUsersDB();
      const user = db.find(u => u.login === login);

      if (!user || user.hash !== hash) {
        notify($("loginNotification"), "Неверный логин или пароль", "error");
        return;
      }

      saveSession({ login: user.login, role: user.role, ts: Date.now() });

      if (user.isTemp) {
        $("authScreen").classList.add("hidden");
        $("forcePasswordModal").classList.remove("hidden");
      } else {
        showDesk(user);
      }
    } finally {
      btn.disabled = false; btn.textContent = "Войти по логину";
    }
  });

  // --- СМЕНА ПАРОЛЯ ---
  $("forcePasswordForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = $("fpNew1").value;
    const p2 = $("fpNew2").value;
    if (p1 !== p2) return notify($("fpNotification"), "Пароли не совпадают", "error");
    if (p1 === "12345" || p1.length < 4) return notify($("fpNotification"), "Пароль ненадежный", "error");

    const btn = $("fpSubmit");
    btn.disabled = true; btn.textContent = "Сохранение…";

    try {
      const hash = await sha256Hex(p1);
      const session = loadSession();
      if (!session) return;

      let db = getUsersDB();
      const idx = db.findIndex(u => u.login === session.login);
      if (idx !== -1) {
        db[idx].hash = hash;
        db[idx].isTemp = false;
        saveUsersDB(db);
      }

      $("forcePasswordModal").classList.add("hidden");
      showDesk(session);
      alert("Пароль успешно изменен!");
    } finally {
      btn.disabled = false; btn.textContent = "Сменить пароль";
    }
  });

  // --- АДМИНКА ---
  function showUsersScreen() {
    $("deskScreen").classList.add("hidden");
    $("usersScreen").classList.remove("hidden");
    renderUsersList();
  }

  function renderUsersList() {
    const db = getUsersDB();
    $("usersList").innerHTML = db.map(u => `
      <div class="user-row">
        <div>
          <div style="font-weight:600;">${u.login}</div>
          <div style="font-size:0.75rem; color:var(--muted);">${u.role} ${u.isTemp ? '(врем. пароль)' : ''}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-small" onclick="editUser('${u.login}')">Изменить</button>
          <button class="btn-small btn-danger" onclick="deleteUser('${u.login}')">Удалить</button>
        </div>
      </div>
    `).join('');
  }

  $("addUserBtn").addEventListener("click", () => {
    $("userFormTitle").textContent = "Новый пользователь";
    $("editUserLogin").value = "";
    $("newUserLogin").value = "";
    $("newUserPassword").value = "12345";
    $("newUserRole").value = "Сотрудник";
    $("newUserLogin").disabled = false;
    $("userFormBlock").classList.remove("hidden");
  });

  $("cancelUserBtn").addEventListener("click", () => $("userFormBlock").classList.add("hidden"));

  $("saveUserBtn").addEventListener("click", async () => {
    const editLogin = $("editUserLogin").value;
    const login = $("newUserLogin").value.trim().toLowerCase();
    const pass = $("newUserPassword").value;
    const role = $("newUserRole").value;

    if (!login || (!editLogin && !pass)) return alert("Заполните логин и пароль");

    let db = getUsersDB();
    const hash = await sha256Hex(pass || "12345");

    if (editLogin) {
      const idx = db.findIndex(u => u.login === editLogin);
      if (idx !== -1) {
        db[idx].role = role;
        if (pass) { db[idx].hash = hash         db[idx].isTemp = true;
        }
      }
    } else {
      if (db.find(u => u.login === login)) return alert("Пользователь с таким логином уже есть");
      db.push({ login, hash, role, isTemp: true });
    }

    saveUsersDB(db);
    $("userFormBlock").classList.add("hidden");
    renderUsersList();
  });

  // Глобальные функции
  window.editUser = (login) => {
    const db = getUsersDB();
    const u = db.find(x => x.login === login);
    if (!u) return;

    $("userFormTitle").textContent = "Редактировать: " + login;
    $("editUserLogin").value = login;
    $("newUserLogin").value = login;
    $("newUserLogin").disabled = true;
    $("newUserPassword").value = ""; 
    $("newUserPassword").placeholder = "Оставьте пустым, чтобы не менять";
    $("newUserRole").value = u.role;
    $("userFormBlock").classList.remove("hidden");
  };

  window.deleteUser = (login) => {
    if (login === 'todd') return alert("Нельзя удалить главного администратора!");
    if (!confirm(`Удалить пользователя ${login}?`)) return;
    
    let db = getUsersDB();
    db = db.filter(u => u.login !== login);
    saveUsersDB(db);
    renderUsersList();
  };

  // Часы и батарея
  setInterval(() => {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    $("statusClock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }, 1000);

  if (navigator.getBattery) {
    navigator.getBattery().then((battery) => {
      const render = () => {
        const pct = Math.round(battery.level * 100);
        $("batText").textContent = pct + "%";
        $("batLevel").style.width = Math.max(2, pct) + "%";
      };
      render();
      battery.addEventListener("levelchange", render);
    });
  }

  // Кнопки
  $("discordLoginBtn").addEventListener("click", (e) => e.preventDefault());
  
  $("logoutBtn").addEventListener("click", () => {
    clearSession();
    showAuth();
  });

  // Старт
  const session = loadSession();
  if (session) {
    showDesk(session);
  } else {
    showAuth();
  }

})();
</script>
</body>
</html>
